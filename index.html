<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QFooty Manager</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#fff;min-height:100vh}header{background:#1e293b;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:20px}.logo span{color:#22c55e}button{background:#22c55e;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}button.sec{background:#334155;color:#fff}button:disabled{opacity:.4}.tabs{display:flex;overflow:auto;background:#1e293b;border-bottom:1px solid #334155;position:sticky;top:53px;z-index:9}.tab{padding:11px 14px;white-space:nowrap;cursor:pointer;opacity:.6;font-size:13px}.tab.active{opacity:1;border-bottom:3px solid #22c55e}.screen{display:none;padding:12px}.screen.active{display:block}.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:10px}.pitch{background:radial-gradient(#22c55e,#15803d);border:2px solid #fff;border-radius:10px;min-height:440px;position:relative;padding:10px}.dot{position:absolute;background:#0f172a;border:2px solid #fff;border-radius:22px;padding:5px 8px;font-size:11px;transform:translate(-50%,-50%);text-align:center;min-width:64px;cursor:grab}.badge{display:inline-block;background:#334155;padding:2px 6px;border-radius:6px;font-size:10px}.ov-high{color:#22c55e}.bench-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bench-player{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}.bench-player.selected{border-color:#22c55e;background:#1a2e1a}table{width:100%;border-collapse:collapse;font-size:12px}th{opacity:.6;text-align:left;padding:5px}td{padding:5px;border-top:1px solid #334155}select{background:#0f172a;color:#fff;border:1px solid #334155;padding:8px;border-radius:8px;width:100%}.subs-left{background:#22c55e;color:#000;font-weight:900;padding:4px 8px;border-radius:6px;font-size:12px}</style></head><body>
<header><div class="logo"><span>Q</span>Footy Manager</div><div id="date">Aug 9 2025</div><button onclick="nextDay()">Next Day ▶</button></header>
<div class="tabs"><div class="tab active" onclick="showTab('dash',this)">Dashboard</div><div class="tab" onclick="showTab('squad',this)">Squad</div><div class="tab" onclick="showTab('tables',this)">Tables</div><div class="tab" onclick="showTab('match',this)">Match</div><div class="tab" onclick="showTab('transfers',this)">Transfers</div></div>
<div id="dash" class="screen active"></div>
<div id="squad" class="screen"><div class="card"><select id="formation" onchange="renderSquad()"><option>4-4-2</option><option>4-3-3</option><option>4-2-3-1</option><option>3-5-2</option><option>3-4-3</option><option>5-3-2</option><option>4-1-4-1</option><option>5-4-1</option><option>4-4-1-1</option><option>3-4-2-1</option><option>4-5-1</option><option>4-3-2-1</option></select><small style="opacity:.6;display:block;margin-top:6px">Drag starters anywhere. Bench auto = 9 players (1 GK mandatory)</small></div><div class="pitch" id="pitch"></div><div id="benchArea"></div></div>
<div id="tables" class="screen"></div>
<div id="match" class="screen"></div>
<div id="transfers" class="screen"></div>
<script>
const TEAMS={"Premier League":["Man City","Arsenal","Liverpool","Chelsea","Man Utd","Newcastle","Tottenham","Aston Villa","Brighton","West Ham","Crystal Palace","Fulham","Wolves","Everton","Brentford","Bournemouth","Nottm Forest","Leicester","Ipswich","Southampton"],"La Liga":["Real Madrid","Barcelona","Atletico","Sevilla","Villarreal","Real Sociedad","Athletic Bilbao","Real Betis","Valencia","Girona","Osasuna","Getafe","Celta","Rayo","Alaves","Mallorca","Las Palmas","Leganes","Valladolid","Espanyol"],"Rest of World PL":["Galatasaray","Fenerbahce","Ajax","PSV","Sporting Lisbon","Benfica","Porto","Celtic","Rangers","Club Brugge","Shakhtar","Olympiacos","Besiktas","Feyenoord","Red Star","Young Boys"],"Rest of World 2":["Inter Miami","Al Nassr","Al Hilal","Al Ittihad","Al Ahli","Flamengo","Palmeiras","River Plate","Boca Juniors","Mamelodi Sundowns","Al Ahly Cairo","Wydad","LAFC","Al Ain","Kaizer Chiefs","Auckland City"]};
const STARS={"Inter Miami":[{n:"Lionel Messi",ov:90,pos:"FWD"},{n:"Luis Suarez",ov:85,pos:"FWD"},{n:"Busquets",ov:82,pos:"MID"}],"Al Nassr":[{n:"Cristiano Ronaldo",ov:88,pos:"FWD"},{n:"Sadio Mane",ov:84,pos:"FWD"}],"Al Hilal":[{n:"Neymar Jr",ov:86,pos:"FWD"},{n:"Mitrovic",ov:84,pos:"FWD"}],"Al Ittihad":[{n:"Benzema",ov:86,pos:"FWD"},{n:"Kante",ov:84,pos:"MID"}],"Real Madrid":[{n:"Mbappe",ov:91,pos:"FWD"},{n:"Vinicius Jr",ov:90,pos:"FWD"},{n:"Bellingham",ov:89,pos:"MID"}],"Man City":[{n:"Haaland",ov:91,pos:"FWD"}],"Barcelona":[{n:"Yamal",ov:86,pos:"FWD"}],"Arsenal":[{n:"Saka",ov:87,pos:"FWD"}]};
let myTeam="Mamelodi Sundowns"; let curDate=new Date("2025-08-09"); let subsUsed=0; let selectedStarter=null; let selectedBench=null;
let formations={"4-4-2":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:15,y:45,pos:"MID"},{x:35,y:45,pos:"MID"},{x:65,y:45,pos:"MID"},{x:85,y:45,pos:"MID"},{x:35,y:15,pos:"FWD"},{x:65,y:15,pos:"FWD"}],"4-3-3":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:30,y:45,pos:"MID"},{x:50,y:50,pos:"MID"},{x:70,y:45,pos:"MID"},{x:20,y:15,pos:"FWD"},{x:50,y:10,pos:"FWD"},{x:80,y:15,pos:"FWD"}],"4-2-3-1":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:35,y:55,pos:"MID"},{x:65,y:55,pos:"MID"},{x:25,y:35,pos:"MID"},{x:50,y:30,pos:"MID"},{x:75,y:35,pos:"MID"},{x:50,y:10,pos:"FWD"}],"3-5-2":[{x:50,y:90,pos:"GK"},{x:25,y:70,pos:"DEF"},{x:50,y:70,pos:"DEF"},{x:75,y:70,pos:"DEF"},{x:10,y:45,pos:"MID"},{x:30,y:45,pos:"MID"},{x:50,y:50,pos:"MID"},{x:70,y:45,pos:"MID"},{x:90,y:45,pos:"MID"},{x:35,y:15,pos:"FWD"},{x:65,y:15,pos:"FWD"}],"3-4-3":[{x:50,y:90,pos:"GK"},{x:25,y:70,pos:"DEF"},{x:50,y:70,pos:"DEF"},{x:75,y:70,pos:"DEF"},{x:15,y:45,pos:"MID"},{x:35,y:45,pos:"MID"},{x:65,y:45,pos:"MID"},{x:85,y:45,pos:"MID"},{x:20,y:15,pos:"FWD"},{x:50,y:10,pos:"FWD"},{x:80,y:15,pos:"FWD"}],"5-3-2":[{x:50,y:90,pos:"GK"},{x:10,y:65,pos:"DEF"},{x:30,y:70,pos:"DEF"},{x:50,y:72,pos:"DEF"},{x:70,y:70,pos:"DEF"},{x:90,y:65,pos:"DEF"},{x:30,y:45,pos:"MID"},{x:50,y:50,pos:"MID"},{x:70,y:45,pos:"MID"},{x:35,y:15,pos:"FWD"},{x:65,y:15,pos:"FWD"}],"4-1-4-1":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:50,y:60,pos:"MID"},{x:15,y:35,pos:"MID"},{x:35,y:35,pos:"MID"},{x:65,y:35,pos:"MID"},{x:85,y:35,pos:"MID"},{x:50,y:10,pos:"FWD"}],"5-4-1":[{x:50,y:90,pos:"GK"},{x:10,y:65,pos:"DEF"},{x:30,y:70,pos:"DEF"},{x:50,y:72,pos:"DEF"},{x:70,y:70,pos:"DEF"},{x:90,y:65,pos:"DEF"},{x:15,y:35,pos:"MID"},{x:35,y:40,pos:"MID"},{x:65,y:40,pos:"MID"},{x:85,y:35,pos:"MID"},{x:50,y:10,pos:"FWD"}],"4-4-1-1":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:15,y:45,pos:"MID"},{x:35,y:45,pos:"MID"},{x:65,y:45,pos:"MID"},{x:85,y:45,pos:"MID"},{x:50,y:30,pos:"MID"},{x:50,y:10pos:"FWD"}],"3-4-2-1":[{x:50,y:90,pos:"GK"},{x:25,y:70,pos:"DEF"},{x:50,y:70,pos:"DEF"},{x:75,y:70,pos:"DEF"},{x:15,y:45,pos:"MID"},{x:35,y:50,pos:"MID"},{x:65,y:50,pos:"MID"},{x:85,y:45,pos:"MID"},{x:35,y:25,pos:"MID"},{x:65,y:25,pos:"MID"},{x:50,y:10,pos:"FWD"}],"4-5-1":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:10,y:40,pos:"MID"},{x:30,y:45,pos:"MID"},{x:50,y:50,pos:"MID"},{x:70,y:45,pos:"MID"},{x:90,y:40,pos:"MID"},{x:50,y:10,pos:"FWD"}],"4-3-2-1":[{x:50,y:90,pos:"GK"},{x:15,y:70,pos:"DEF"},{x:35,y:70,pos:"DEF"},{x:65,y:70,pos:"DEF"},{x:85,y:70,pos:"DEF"},{x:30,y:50,pos:"MID"},{x:50,y:55,pos:"MID"},{x:70,y:50,pos:"MID"},{x:35,y:30,pos:"FWD"},{x:65,y:30,pos:"FWD"},{x:50,y:10,pos:"FWD"}]};
function genSquad(team){let sq=[]; if(STARS[team]) sq.push(...STARS[team].map(s=>({...s,age:26+Math.floor(Math.random()*8)}))); let posList=["GK","DEF","DEF","DEF","DEF","MID","MID","MID","MID","FWD","FWD","GK","DEF","DEF","MID","MID","MID","FWD","FWD","GK"]; let need=20-sq.length; for(let i=0;i<need;i++){let pos=posList[i%posList.length]; let ov=58+Math.floor(Math.random()*22); sq.push({n:pos+(i+1),ov,pos,age:18+Math.floor(Math.random()*14)})} return sq.sort((a,b)=>b.ov-a.ov).slice(0,20); }
let squad=genSquad(myTeam);
function ensureBench(){let starters=squad.slice(0,11); let bench=squad.slice(11,20); let hasGK=bench.some(p=>p.pos==="GK"); if(!hasGK){let gkPool=squad.filter(p=>p.pos==="GK" &&!bench.includes(p)); if(gkPool.length>0){bench[0]=gkPool[0];} else {bench[0]={n:"GK Backup",ov:65,pos:"GK",age:22}; squad[11]=bench[0];}} return {starters,bench};}
function showTab(id,el){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active'); if(el) el.classList.add('active'); if(id==='dash') renderDash(); if(id==='squad') renderSquad(); if(id==='tables') renderTables(); if(id==='match') renderMatch(); if(id==='transfers') renderTransfers();}
function nextDay(){curDate.setDate(curDate.getDate()+1);document.getElementById('date').textContent=curDate.toDateString();renderDash();}
function renderDash(){document.getElementById('dash').innerHTML=`<div class="card"><h3>${myTeam}</h3><p style="opacity:.7">${curDate.toDateString()} - Season 2025/26</p><p style="margin-top:8px">Squad 20 | XI avg OVR: ${Math.round(squad.slice(0,11).reduce((a,b)=>a+b.ov,0)/11)} | Bench: 9 (1 GK)</p></div><div class="card"><h4>Next Match - Subs: 5 max</h4><p>${myTeam} vs Galatasaray - Sat 15:00</p><button style="margin-top:8px" onclick="showTab('match',document.querySelectorAll('.tab')[3])">Go to Match</button></div>`;}
function renderSquad(){let f=document.getElementById('formation').value; let spots=formations[f]; let pitch=document.getElementById('pitch'); pitch.innerHTML=""; let {starters,bench}=ensureBench(); starters.forEach((p,i)=>{let spot=spots[i]||{x:50,y:50,pos:p.pos}; let d=document.createElement('div'); d.className='dot'; d.style.left=spot.x+'%'; d.style.top=spot.y+'%'; d.innerHTML=`${p.n}<br><b class=ov-high>${p.ov}</b><br><span class=badge>${spot.pos}</span>`; d.onclick=()=>selectStarter(i); pitch.appendChild(d);}); let benchHtml=`<div class="card"><h4>Bench (9) - 1 GK Mandatory <span class="subs-left">${5-subsUsed} subs left</span></h4><div class="bench-grid">`; bench.forEach((p,i)=>{benchHtml+=`<div class="bench-player ${selectedBench===i?'selected':''}" onclick="selectBench(${i})"><span><b>${p.n}</b> <span class=badge>${p.pos}</span> OVR ${p.ov}</span><span>${p.pos==='GK'?'🧤':''}</span></div>`}); benchHtml+=`</div><div style="margin-top:10px;display:flex;gap:8px"><button onclick="doSub()" ${subsUsed>=5?'disabled':''}>Make Sub (${subsUsed}/5)</button><button class="sec" onclick="clearSel()">Clear</button></div><p style="opacity:.6;font-size:11px;margin-top:6px">Tap starter on pitch then bench player then Make Sub. GK can only replace GK.</p></div>`; document.getElementById('benchArea').innerHTML=benchHtml;}
function selectStarter(i){selectedStarter=i; renderSquad();}
function selectBench(i){selectedBench=i; renderSquad();}
function clearSel(){selectedStarter=null; selectedBench=null; renderSquad();}
function doSub(){if(selectedStarter===null||selectedBench===null){alert('Select starter + bench first'); return;} if(subsUsed>=5){alert('5 subs already used'); return;} let {bench}=ensureBench(); let starter=squad[selectedStarter]; let benchP=bench[selectedBench]; if(starter.pos==='GK' && benchP.pos!=='GK'){alert('GK can only be replaced by GK'); return;} if(starter.pos!=='GK' && benchP.pos==='GK' && selectedStarter!==0){alert('Only GK can replace GK'); return;} let benchIndex=11+selectedBench; let temp=squad[selectedStarter]; squad[selectedStarter]=squad[benchIndex]; squad[benchIndex]=temp; subsUsed++; selectedStarter=null; selectedBench=null; renderSquad(); if(document.getElementById('match').classList.contains('active')) renderMatch();}
function renderTables(){let h=""; Object.keys(TEAMS).forEach(l=>{h+=`<div class="card"><h4>${l}</h4><table><tr><th>#</th><th>Team</th><th>Pts</th></tr>`; TEAMS[l].forEach((t,i)=>{h+=`<tr><td>${i+1}</td><td>${t} ${t===myTeam?'<span class=badge>YOU</span>':''}</td><td>${Math.floor(Math.random()*28)}</td></tr>`}); h+=`</table></div>`;}); document.getElementById('tables').innerHTML=h;}
function renderMatch(){let {starters,bench}=ensureBench(); let html=`<div class="card"><h3>Match Day - Subs Rule: 5 max</h3><p>${myTeam} 0 - 0 Galatasaray</p><div style="display:flex;gap:8px;margin-top:8px"><span class="subs-left">Subs used: ${subsUsed}/5</span><button class="sec" onclick="subsUsed=0;renderMatch();renderSquad()">Reset Subs</button></div></div>`; html+=`<div class="card"><h4>On Pitch (11)</h4><div class="bench-grid">`; starters.forEach((p,i)=>{html+=`<div class="bench-player ${selectedStarter===i?'selected':''}"><span>${p.n} ${p.pos} ${p.ov}</span></div>`}); html+=`</div></div>`; html+=`<div class="card"><h4>Bench (9) - Tap to Sub</h4><div class="bench-grid">`; bench.forEach((p,i)=>{html+=`<div class="bench-player ${selectedBench===i?'selected':''}" onclick="selectBench(${i});renderSquad()"><span>${p.n} <span class=badge>${p.pos}</span> ${p.ov} ${p.pos==='GK'?'🧤':''}</span><button ${subsUsed>=5?'disabled':''} onclick="event.stopPropagation();doSub()">Sub In</button></div>`}); html+=`</div><button style="width:100%;margin-top:12px;padding:12px" onclick="alert('Match simulated! Subs used: '+subsUsed+'/5')">Simulate Match</button></div>`; document.getElementById('match').innerHTML=html;}
function renderTransfers(){document.getElementById('transfers').innerHTML=`<div class="card"><h4>Transfer Market</h4></div><div class="card" style="display:flex;justify-content:space-between"><div><b>Messi</b> OVR 90</div><button onclick="squad.push({n:'Messi',ov:90,pos:'FWD',age:38});renderDash();alert('Messi signed to bench')">Buy $18M</button></div>`;}
renderDash(); renderSquad();
</script></body></html>
