let myTeam=localStorage.getItem('qfooty_myTeam')||'Santos';
let myLeague=Object.keys(TEAMS).find(l=>TEAMS[l].includes(myTeam))||'Rest of World 2';
function getBudget(team){if(BUDGETS[team]) return BUDGETS[team]; let lg=Object.keys(TEAMS).find(l=>TEAMS[l].includes(team)); if(lg==='Premier League') return BUDGETS.default_PL_mid; if(lg==='Championship') return BUDGETS.default_Champ; if(lg==='La Liga') return BUDGETS.default_LaLiga; if(lg==='Bundesliga') return BUDGETS.default_Bundes; if(lg==='Ligue 1') return BUDGETS.default_Ligue1; if(lg==='Rest of World Super League') return BUDGETS.default_RestSuper; return BUDGETS.default_Rest2;}
  let budget=parseInt(localStorage.getItem('qfooty_budget_'+myTeam)||getBudget(myTeam).toString());
let gameWeek=parseInt(localStorage.getItem('qfooty_gw')||'1');
let db={}, leagueTable={}, fixtures=[], results=[], playerStats={}, transferMarket=[];
function genSquad(team){let arr=[]; if(STARS[team]){let s=STARS[team]; arr.push({id:1,name:s.name,ovr:s.ovr,pos:'FW',isStar:true,isStarting:true,goals:0,assists:0,cs:0}); if(!playerStats[s.name]) playerStats[s.name]={team:team,goals:0,assists:0,cs:0,ovr:s.ovr,pos:'FW'};} let seq=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FW','FW','FW','GK','DEF','MID','MID','FW','DEF','MID','FW','DEF','MID','FW']; let id=100; for(let p of seq){if(arr.length>=22) break; let ovr=team===myTeam?70+Math.random()*10:60+Math.random()*15; let name='P'+id+'-'+team.slice(0,3); let pos=p; arr.push({id:id++,name:name,pos:pos,ovr:Math.min(92,Math.floor(ovr)),isStar:false,isStarting:arr.length<11,goals:0,assists:0,cs:0}); if(!playerStats[name]) playerStats[name]={team:team,goals:0,assists:0,cs:0,ovr:Math.floor(ovr),pos:pos};} return arr;}
function initMarket(){transferMarket=[]; let names=['J. Smith','A. Silva','K. Muller','T. Ahmed','L. Jones','R. Garcia','M. Okocha','B. Saka','C. Palmer','E. Foden','V. Osimhen','J. Bellingham','P. Sane','H. Son','D. Rice']; for(let i=0;i<25;i++){let ovr=68+Math.floor(Math.random()*22); let pos=['FW','MID','DEF','GK'][Math.floor(Math.random()*4)]; let name=names[Math.floor(Math.random()*names.length)]+' '+(i+1); let value=Math.floor(ovr*0.9 + Math.random()*15); transferMarket.push({id:1000+i,name:name,ovr:ovr,pos:pos,value:value});}}
function initLeague(){myLeague=Object.keys(TEAMS).find(l=>TEAMS[l].includes(myTeam))||myLeague; let teams=TEAMS[myLeague]; leagueTable={}; teams.forEach(t=>{leagueTable[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0};}); let saved=JSON.parse(localStorage.getItem('qfooty_table_'+myLeague)||'null'); if(saved) leagueTable=saved; let savedStats=JSON.parse(localStorage.getItem('qfooty_stats_'+myLeague)||'null'); if(savedStats) playerStats=savedStats; genFixtures(); let savedFix=JSON.parse(localStorage.getItem('qfooty_fixtures_'+myLeague)||'null'); if(savedFix) fixtures=savedFix; let savedRes=JSON.parse(localStorage.getItem('qfooty_results_'+myLeague)||'[]'); results=savedRes; initMarket();}
function genFixtures(){let teams=TEAMS[myLeague]; let others=teams.filter(t=>t!==myTeam); fixtures=[]; let shuffled=[...others].sort(()=>Math.random()-0.5); let gw=1; shuffled.forEach(op=>{fixtures.push({gw:gw++,home:myTeam,away:op,played:false});}); shuffled.sort(()=>Math.random()-0.5).forEach(op=>{fixtures.push({gw:gw++,home:op,away:myTeam,played:false});}); fixtures.sort((a,b)=>a.gw-b.gw); if(teams.length===20 && fixtures.length>38){fixtures=fixtures.slice(0,38); fixtures.forEach((f,i)=>f.gw=i+1);}}
function getNextFixture(){return fixtures.find(f=>!f.played);}
function awardGoals(team,count){let squad=db[team]; if(!squad) return []; let fwds=squad.filter(p=>p.pos==='FW').sort((a,b)=>b.ovr-a.ovr); let mids=squad.filter(p=>p.pos==='MID'); let scorers=[]; for(let i=0;i<count;i++){let pool=Math.random()<0.7?fwds:mids; let scorer=pool[Math.floor(Math.random()*Math.min(3,pool.length))]; if(scorer){scorer.goals=(scorer.goals||0)+1; if(playerStats[scorer.name]){playerStats[scorer.name].goals++; playerStats[scorer.name].team=team;} else{playerStats[scorer.name]={team:team,goals:1,assists:0,cs:0,ovr:scorer.ovr,pos:scorer.pos};} let assister=mids[Math.floor(Math.random()*mids.length)]; if(assister && assister.name!==scorer.name){assister.assists=(assister.assists||0)+1; if(playerStats[assister.name]) playerStats[assister.name].assists++;} scorers.push(scorer.name);}} return scorers;}
function awardCleanSheet(team){let squad=db[team]; if(!squad) return; let gk=squad.find(p=>p.pos==='GK' && p.isStarting) || squad.find(p=>p.pos==='GK'); if(gk){gk.cs=(gk.cs||0)+1; if(playerStats[gk.name]) playerStats[gk.name].cs++;} squad.filter(p=>p.pos==='DEF' && p.isStarting).forEach(d=>{d.cs=(d.cs||0)+1; if(playerStats[d.name]) playerStats[d.name].cs++;});}
  function playNextMatch(){let f=getNextFixture(); if(!f){alert('Season Over! Champion: '+getChampion()); return;} let mySquad=db[myTeam]; let myAvg=mySquad.slice(0,11).reduce((a,b)=>a+b.ovr,0)/11; let oppAvg=65+Math.random()*15; let myGoals=Math.floor(Math.random()*(myAvg/35)+Math.random()*1.8); let oppGoals=Math.floor(Math.random()*(oppAvg/35)+Math.random()*1.3); if(f.home===myTeam) myGoals=Math.max(myGoals, Math.floor(Math.random()*2)); f.played=true; f.myGoals=f.home===myTeam?myGoals:oppGoals; f.oppGoals=f.home===myTeam?oppGoals:myGoals; f.result=f.myGoals>f.oppGoals?'W':f.myGoals===f.oppGoals?'D':'L'; let hG=f.home===myTeam?f.myGoals:f.oppGoals; let aG=f.away===myTeam?f.myGoals:f.oppGoals; let myScorers=[], oppScorers=[]; if(hG>0) myScorers=awardGoals(f.home, hG); if(aG>0) oppScorers=awardGoals(f.away, aG); if(hG===0) awardCleanSheet(f.away); if(aG===0) awardCleanSheet(f.home); f.scorersMy=f.home===myTeam?myScorers:oppScorers; f.scorersOpp=f.home===myTeam?oppScorers:myScorers; leagueTable[f.home].P++; leagueTable[f.away].P++; leagueTable[f.home].GF+=hG; leagueTable[f.home].GA+=aG; leagueTable[f.away].GF+=aG; leagueTable[f.away].GA+=hG; if(hG>aG){leagueTable[f.home].W++; leagueTable[f.home].PTS+=3; leagueTable[f.away].L++;} else if(aG>hG){leagueTable[f.away].W++; leagueTable[f.away].PTS+=3; leagueTable[f.home].L++;} else{leagueTable[f.home].D++; leagueTable[f.away].D++; leagueTable[f.home].PTS++; leagueTable[f.away].PTS++;} let otherTeams=TEAMS[myLeague].filter(t=>t!==f.home && t!==f.away); for(let i=0;i<otherTeams.length;i+=2){if(i+1>=otherTeams.length) break; let t1=otherTeams[i]; let t2=otherTeams[i+1]; let g1=Math.floor(Math.random()*3); let g2=Math.floor(Math.random()*3); leagueTable[t1].P++; leagueTable[t2].P++; leagueTable[t1].GF+=g1; leagueTable[t1].GA+=g2; leagueTable[t2].GF+=g2; leagueTable[t2].GA+=g1; if(g1>0) awardGoals(t1,g1); if(g2>0) awardGoals(t2,g2); if(g1===0) awardCleanSheet(t2); if(g2===0) awardCleanSheet(t1); if(g1>g2){leagueTable[t1].W++; leagueTable[t1].PTS+=3; leagueTable[t2].L++;} else if(g2>g1){leagueTable[t2].W++; leagueTable[t2].PTS+=3; leagueTable[t1].L++;} else{leagueTable[t1].D++; leagueTable[t2].D++; leagueTable[t1].PTS++; leagueTable[t2].PTS++;}} results.push(f); localStorage.setItem('qfooty_table_'+myLeague, JSON.stringify(leagueTable)); localStorage.setItem('qfooty_fixtures_'+myLeague, JSON.stringify(fixtures)); localStorage.setItem('qfooty_results_'+myLeague, JSON.stringify(results)); localStorage.setItem('qfooty_stats_'+myLeague, JSON.stringify(playerStats)); localStorage.setItem('qfooty_gw', (f.gw+1).toString()); gameWeek=f.gw+1; renderAll();}
function getChampion(){let s=Object.entries(leagueTable).sort((a,b)=>b[1].PTS-a[1].PTS); return s[0]?s[0][0]:'-';}
function getTopScorers(){return Object.entries(playerStats).sort((a,b)=>b[1].goals-a[1].goals).slice(0,20);}
function getTopAssists(){return Object.entries(playerStats).sort((a,b)=>b[1].assists-a[1].assists).slice(0,10);}
function getTopCleanSheets(){return Object.entries(playerStats).filter(e=>e[1].pos==='GK' || e[1].cs>0).sort((a,b)=>b[1].cs-a[1].cs).slice(0,10);}
function getLeagueTopScorers(){let perLeague={}; Object.entries(playerStats).forEach(([name,data])=>{let lg=Object.keys(TEAMS).find(l=>TEAMS[l].includes(data.team))||myLeague; if(!perLeague[lg]) perLeague[lg]=[]; perLeague[lg].push({name:name,...data});}); Object.keys(perLeague).forEach(lg=>{perLeague[lg].sort((a,b)=>b.goals-a.goals); perLeague[lg]=perLeague[lg].slice(0,5);}); return perLeague;}
  function buyPlayer(id){let p=transferMarket.find(x=>x.id===id); if(!p) return; if(budget<p.value){alert('No money! Need $'+p.value+'M have $'+budget+'M - '+myTeam+' budget is $'+getBudget(myTeam)+'M'); return;} budget-=p.value; let squad=db[myTeam]; squad.push({id:Date.now(),name:p.name,ovr:p.ovr,pos:p.pos,isStar:p.ovr>=85,isStarting:false,goals:0,assists:0,cs:0}); playerStats[p.name]={team:myTeam,goals:0,assists:0,cs:0,ovr:p.ovr,pos:p.pos}; transferMarket=transferMarket.filter(x=>x.id!==id); localStorage.setItem('qfooty_budget_'+myTeam, budget.toString()); localStorage.setItem('qfooty_stats_'+myLeague, JSON.stringify(playerStats)); renderAll();}
function sellPlayer(name){let squad=db[myTeam]; let idx=squad.findIndex(p=>p.name===name); if(idx===-1) return; let p=squad[idx]; let val=Math.floor(p.ovr*0.8); budget+=val; squad.splice(idx,1); localStorage.setItem('qfooty_budget_'+myTeam, budget.toString()); renderAll();}
function init(){Object.keys(TEAMS).forEach(lg=>TEAMS[lg].forEach(t=>{db[t]=genSquad(t);})); initLeague(); renderAll();}

  document.getElementById('budgetLabel').innerText=myTeam+' $'+budget+'M / Real $'+getBudget(myTeam)+'M';
