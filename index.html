 let all=[...TEAMS_DATA["Rest of World League 1"].slice(0,8),...TEAMS_DATA["Rest of World League 2"].slice(0,8)];
 let h=`<div class='cyber-bg'><div class='center'><div style='color:#22c55e;font-weight:800'>Team Editor - RoW L1 & L2 - 32 teams - ${season}</div><div class='small' style='color:#22c55e'>Santos Neymar, Miami Messi, Nassr Ronaldo in RoW L1 as you said</div></div>`;
 all.forEach(t=>{ let badge=t.includes("Neymar")?"Neymar":t.includes("Messi")?"Messi":t.includes("Ronaldo")?"Ronaldo":t.includes("Benzema")?"Benzema":"RoW"; h+=`<div class='dark-card row'><div>${t} <span class='badge'>${badge}</span></div></div>`; });
 h+=`<div style='position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px'><button class='gold-btn' style='width:49%;background:#334155;color:#fff'>Edit Info - Neymar/Messi/Ronaldo</button><button class='gold-btn' style='width:49%'>Edit Players - 32 teams</button></div></div>`; document.getElementById('app').innerHTML=h;
}
function initSeason(){
 let isRoW1=TEAMS_DATA["Rest of World League 1"].map(t=>t.split(' $')[0]).includes(myTeam);
 let isRoW2=TEAMS_DATA["Rest of World League 2"].map(t=>t.split(' $')[0]).includes(myTeam);
 let leagueTeams;
 if(isRoW1){ leagueTeams=TEAMS_DATA["Rest of World League 1"].map(t=>t.split(' $')[0]); }
 else if(isRoW2){ leagueTeams=TEAMS_DATA["Rest of World League 2"].map(t=>t.split(' $')[0]); }
 else { leagueTeams=TEAMS_DATA["Premier League"].map(t=>t.split(' $')[0]).slice(0,20); }
 table={}; leagueTeams.forEach(t=>table[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0,CS:0});
 fixtures=[]; let others=leagueTeams.filter(t=>t!==myTeam); let gw=1;
 others.forEach(o=>{ fixtures.push({gw:gw++,home:myTeam,away:o,played:false,mg:0,og:0,res:'',comp:isRoW1?'RoW League 1 (16)':isRoW2?'RoW League 2 (16)':'League 1st',date:`Aug ${gw} 2025`,tier:isRoW1?'RoW L1':isRoW2?'RoW L2':'1st'}); });
 others.forEach(o=>{ fixtures.push({gw:gw++,home:o,away:myTeam,played:false,mg:0,og:0,res:'',comp:isRoW1?'RoW L1':isRoW2?'RoW L2':'League',date:`Sep ${gw} 2025`,tier:isRoW1?'RoW L1':isRoW2?'RoW L2':'1st'}); });
 fixtures=fixtures.slice(0,30); stats={}; squad.forEach(p=>{ stats[p.n]={g:0,cs:0}; }); saveSeason();
}
function saveSeason(){ localStorage.setItem('qfooty104_table_'+myTeam,JSON.stringify(table)); localStorage.setItem('qfooty104_fix_'+myTeam,JSON.stringify(fixtures)); }
function renderSquad(){
 let next=fixtures.find(f=>!f.played); let nextText=next?`${next.comp} vs ${next.home===myTeam?next.away:next.home} - ${next.date} - ${next.tier}`:'Done';
 let pos=Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS).findIndex(e=>e[0]===myTeam)+1;
 let tierLabel=fixtures[0]?.tier||'RoW L1';
 document.getElementById('app').innerHTML=`<div class='top'><div class='top1'><div><div class='teal'>${myTeam} (${pos||1}st) - $${budget}M - ${season} - ${tierLabel}</div><div>${coach}</div><div style='color:#22c55e;font-weight:800'>Next - ${tierLabel} - RoW 32 teams</div><div>${next?next.comp:'RoW League 1'} - GW${currentRound} - ${nextText}</div><div class='small' style='color:#22c55e'>RoW L1 & L2: 32 teams (16+16) - Santos Neymar, Miami Messi, Nassr Ronaldo in L1 • Tier1+2 • UCL Sep-Jun • WC Jun-Jul 2026</div></div><div style='text-align:right'><div>6/22/22 | ${season}</div><div>Chairman <div class='bar'><div style='width:100%'></div></div> 100%</div><div>Supporters <div class='bar'><div style='width:100%'></div></div> 100%</div><div style='margin-top:4px;font-weight:900'>$${budget}M</div><div class='small'>P ${table[myTeam]?.P||0} PTS ${table[myTeam]?.PTS||0}</div></div></div></div><div class='tabBar'><div class='tab on'>Squad ${tierLabel}</div><div class='tab' onclick='renderTableFull()'>Table ${tierLabel} 16</div><div class='tab' onclick='renderFixturesFull()'>Fix ${tierLabel}</div><div class='tab' onclick='renderPromo()'>Promo RoW L1-L2</div></div><div class='squad-head'><div>👤 ${squad.length} • ${season} • ${tierLabel} • Santos Neymar, Miami Messi, Nassr Ronaldo</div><div>Order by Pos</div></div><div>${squad.map(p=>`<div class='row'><div style='display:flex;gap:6px;align-items:center'><div class='pos'>${p.pos}</div><div><div style='font-weight:700'>${p.n} ${p.star?'<span class="star">★</span>':''} <span class='small'>${stats[p.n]?.g||0}⚽ ${p.note||''}</span></div><div class='small'>${p.val} (Sal: ${p.sal})<br>${p.flag} Age: ${p.age} Energy: ${p.energy}% ${p.note||''}</div></div></div><div class='ovr'>${p.ovr}</div></div>`).join('')}</div><div id='popup'></div><div class='bottom'><div class='bicon active' onclick='renderSquad()'>⚽</div><div class='bicon' onclick='openPopup("tactics")'>📋</div><div class='bicon' onclick='openPopup("fixtures")'>📅</div><div class='bicon' onclick='openPopup("trophy")'>🏆</div><div class='bicon' onclick='openPopup("settings")'>⚙️</div></div>`;
}
function renderTableFull(){
 let sorted=Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS);
 let tierLabel=fixtures[0]?.tier||'RoW L1';
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Table - ${myTeam} #${sorted.findIndex(e=>e[0]===myTeam)+1} - ${season} - ${tierLabel} - 16 teams</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab on'>Table ${tierLabel} 16</div><div class='tab' onclick='renderPromo()'>Promo RoW L1-L2</div></div><div class='dark-card'><div class='row' style='font-weight:800'><div># Team ${tierLabel} (16)</div><div>P PTS</div></div>${sorted.map((e,i)=>`<div class='row' style='${e[0]===myTeam?'background:#22c55e22':''}'><div>${i+1}. ${e[0]} ${e[0]==='Santos'?'<span class="badge">Neymar</span>':''} ${e[0]==='Inter Miami'?'<span class="badge2">Messi</span>':''} ${e[0]==='Al Nassr'?'<span class="badgeR">Ronaldo</span>':''}</div><div>${e[1].P} ${e[1].PTS}</div></div>`).join('')}</div><div class='dark-card small'><div style='color:#22c55e'>RoW 32 teams (16+16) as you said:</div><b>RoW L1 (16):</b> Santos Neymar, Miami Messi, Nassr Ronaldo + 13 big teams<br><b>RoW L2 (16):</b> Corinthians, Fluminense, Racing, Independiente, LAFC, America, Chivas, PSV, Feyenoord, Sporting, Fenerbahce, Wydad, Urawa, Al Ittihad Benzema, Seattle, Colo-Colo<br>Promotion: RoW L1 Bottom 2 to L2, RoW L2 Top 2 to L1<br>Dates: Aug 2025-May 2026 + UCL Sep-Jun + WC Jun-Jul 2026</div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>📊</div><div class='bicon' onclick='home()'>🏠</div></div>`;
}
function renderPromo(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Promotion - RoW L1-L2 + Tier 1-2 - ${season} - 32 teams RoW</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab' onclick='renderTableFull()'>Table</div><div class='tab on'>Promo RoW 32</div></div><div class='dark-card'><div style='color:#22c55e;font-weight:800'>RoW - 32 TEAMS (16+16):</div><div class='row'><div>RoW League 1 (16) → Bottom 2 to RoW L2</div><div>Santos Neymar, Miami Messi, Nassr Ronaldo in L1</div></div><div class='row'><div>RoW League 2 (16) → Top 2 to RoW L1</div><div>Total 32 as you said</div></div></div><div class='dark-card small'><div style='color:#22c55e'>Your Complete Setup 2025/26:</div>RoW L1 (16): Santos Neymar $75M, Miami Messi $90M, Nassr Ronaldo $120M + 13 big teams<br>RoW L2 (16): 16 teams - Total RoW 32 (16+16)<br>Tier 1+2 Europe + Euro UCL + WC 2026</div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>⬆️⬇️</div><div class='bicon' onclick='home()'>🏠</div></div>`;
}
function renderFixturesFull(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e'>Fixtures - ${fixtures[0]?.tier||'RoW L1'} - 16 teams - RoW 32 total</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab on'>Fix ${fixtures[0]?.tier||'RoW L1'} 16</div><div class='tab' onclick='renderPromo()'>Promo</div></div><div class='dark-card'>${fixtures.map(f=>`<div class='row'><div><span class='badge'>${f.comp}</span> <span class='badge2'>${f.tier}</span> GW${f.gw} ${f.home} ${f.played?f.mg+'-'+f.og:'vs'} ${f.away}<br><span class='small'>${f.date||''}</span></div><div>${f.played?f.res:'UP'}</div></div>`).join('')}</div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>📅</div></div>`;
}
function openPopup(type){
 let el=document.getElementById('popup'); if(!el){ let d=document.createElement('div'); d.id='popup'; document.getElementById('app').appendChild(d); el=d; }
 if(type==='tactics'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderLineup()'>Lineup 4-4-2 - GW${currentRound} - ${season}</div><div class='pitem' onclick='renderTableFull()'>Show all teams - 16 teams - Santos Neymar, Miami Messi, Nassr Ronaldo</div><div class='pitem' onclick='renderPromo()'>Promotion - RoW L1-L2 - 32 teams</div></div>`; }
 else if(type==='fixtures'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderTableFull()'>Standing - ${season}</div><div class='pitem' onclick='renderFixturesFull()'>Your Fixtures - ${fixtures.filter(f=>!f.played).length} left</div><div class='pitem' onclick='renderPromo()'>RoW L1-L2 - 32 teams (16+16)</div></div>`; }
 else if(type==='trophy'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderTableFull()'>Teams Ranking</div><div class='pitem' onclick='renderPromo()'>Promotion Table</div></div>`; }
 else if(type==='settings'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='saveSeason();alert("Saved")'>Save game</div><div class='pitem' onclick='home()'>Main menu</div><div class='pitem'>About 10.4 - RoW 32 teams (16+16): Santos Neymar, Miami Messi, Nassr Ronaldo in L1</div></div>`; }
}
function renderLineup(){
 let lineup=squad.slice(0,11);
 document.getElementById('app').innerHTML=`<div class='top'><div class='top1'><div>Lineup 4-4-2 GW${currentRound} - ${season} - ${fixtures[0]?.tier||'RoW L1'}</div><div><button class='btn' style='width:auto;padding:4px 8px' onclick='renderSquad()'>Back</button></div></div></div><div style='display:flex'><div style='flex:1'>${lineup.map(p=>`<div class='row'><div><div class='pos'>${p.pos.startsWith("GK")?"GK":"ATT"}</div><div style='font-weight:700'>${p.n} ${p.note||''}</div></div><div class='ovr'>${p.ovr}</div></div>`).join('')}</div><div style='width:130px;background:#1e293b;padding:6px'><button class='btn' style='margin-top:20px;background:#22c55e' onclick='startLive()'>Play GW${currentRound}</button></div></div>`;
}
function startLive(){ liveMinute=0; scoreA=0; scoreB=0; scorersA=[]; renderLive(); let iv=setInterval(()=>{ liveMinute++; if(liveMinute===8){scoreA=1; scorersA.push(myTeam+" 8'");} if(liveMinute===36){scoreA=2; scorersA.push("Palmer 36'");} if(liveMinute===53){scoreA=3; scorersA.push("Blessed 53'");} if(liveMinute===45){clearInterval(iv); renderHalf(); return;} if(liveMinute>=90){clearInterval(iv); finishMatch(); return;} renderLive(); },200); }
function renderLive(){
 document.getElementById('app').innerHTML=`<div class='top'><div>${fixtures.find(f=>f.gw===currentRound)?.comp||'RoW League 1'} - GW${currentRound} - ${season}</div><div class='clock'>${liveMinute}'</div></div><div class='liveTop'><div class='scoreBox'><div class='tA'>${myTeam}</div><div class='sc'>${scoreA}-${scoreB}</div><div class='tB'>Flamengo</div></div></div><div class='mini' style='padding:4px 8px'>${scorersA.join(" ")} | ${season} | Santos Neymar, Miami Messi, Nassr Ronaldo in RoW L1 - 32 teams</div><div class='liveCard'><div style='text-align:center;color:#22c55e;font-weight:800'>Live GW${currentRound} - ${season} - RoW L1 16 teams</div><div class='row' style='background:#22c55e22'><div style='flex:1;text-align:right'>${myTeam}</div><div style='width:60px;text-align:center;font-weight:800'>${scoreA}-${scoreB}</div><div style='flex:1'>Flamengo</div></div><div class='row' style='background:transparent;border:0'><div style='flex:1;text-align:right'>Santos Neymar</div><div style='width:60px;text-align:center'>1-0</div><div style='flex:1'>Palmeiras - RoW L1</div></div><div class='row' style='background:transparent;border:0'><div style='flex:1;text-align:right'>Inter Miami Messi</div><div style='width:60px;text-align:center'>2-1</div><div style='flex:1'>LA Galaxy - RoW L1</div></div><div class='row' style='background:transparent;border:0'><div style='flex:1;text-align:right'>Al Nassr Ronaldo</div><div style='width:60px;text-align:center'>2-0</div><div style='flex:1'>Al Hilal - RoW L1</div></div></div>`;
}
function renderHalf(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Half-Time GW${currentRound} - ${season}</div></div><div class='liveTop'><div style='flex:1;text-align:center'>${myTeam}</div><div style='flex:0 0 130px;text-align:center'><div style='background:#fff;color:#000;padding:4px'>Match info</div><div style='font-size:20px;font-weight:900'>${scoreA}-${scoreB}</div><div style='font-size:10px'>${scorersA.join("<br>")}</div></div><div style='flex:1;text-align:center'>Flamengo</div></div><button class='btn' style='position:fixed;bottom:0;left:0;right:0;border-radius:0' onclick='resumeSecondHalf()'>Back to match</button>`;
}
function resumeSecondHalf(){ liveMinute=45; renderLive(); let iv=setInterval(()=>{ liveMinute++; if(liveMinute>=90){clearInterval(iv); finishMatch();} else renderLive(); },150); }
function finishMatch(){
 let next=fixtures.find(f=>f.gw===currentRound); if(next){ next.played=true; next.mg=scoreA; next.og=scoreB; next.res=scoreA>scoreB?'W':'D'; let t=table[myTeam]; if(t){ t.P++; t.GF+=scoreA; t.GA+=scoreB; if(scoreA>scoreB){t.W++; t.PTS+=3;} else {t.D++; t.PTS++;} } } currentRound++; saveSeason();
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;color:#22c55e;width:100%'>Round results GW${currentRound-1} - ${season} - Santos Neymar, Miami Messi, Nassr Ronaldo - RoW L1</div></div><div class='liveCard'><div class='row' style='background:#22c55e22'><div style='flex:1;text-align:right'>${myTeam}</div><div style='width:50px;text-align:center;font-weight:900'>${scoreA}-${scoreB}</div><div style='flex:1'>Flamengo - WIN</div></div></div><div style='position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px;background:#000'><button class='btn' style='width:33%;background:#334155;color:#fff' onclick='renderTableFull()'>Table</button><button class='btn' style='width:33%' onclick='renderSquad()'>Continue GW${currentRound}</button><button class='btn' style='width:33%;background:#facc15;color:#000' onclick='renderLineup()'>Next</button></div>`;
}
home();
</script></body></html>
