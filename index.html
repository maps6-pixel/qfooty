// Build a lookup of every listed team -> approximate club rating, derived from its $ value.
// This replaces the old hardcoded "8', 36', 53'" scripted goals.
let TEAM_RATING_MAP=null;
function buildTeamRatingMap(){
 if(TEAM_RATING_MAP) return TEAM_RATING_MAP;
 TEAM_RATING_MAP={};
 Object.values(TEAMS_DATA).forEach(list=>{
  list.forEach(entry=>{
   let name=entry.split(' $')[0];
   let m=entry.match(/\$(\d+)/);
   let val=m?parseInt(m[1]):40;
   // Map club budget ($10M-$300M) onto a ~62-92 rating curve (log-ish, diminishing returns)
   let rating=Math.round(62+Math.min(30,(Math.log(val+1)/Math.log(300))*30));
   TEAM_RATING_MAP[name]=rating;
  });
 });
 return TEAM_RATING_MAP;
}
function opponentRating(name){
 let map=buildTeamRatingMap();
 if(map[name]!=null) return map[name];
 return 70; // fallback for unlisted teams
}
// My team's effective rating = energy-weighted average of the starting XI (squad already sorted best-first-ish).
function squadRating(){
 let xi=squad.slice(0,11);
 if(!xi.length) return 70;
 let sum=0,w=0;
 xi.forEach(p=>{ let weight=(p.energy||90)/100; sum+=p.ovr*weight; w+=weight; });
 return sum/w;
}
// Expected goals for each side from the rating gap, clamped to sane football scorelines.
function expectedGoals(myR,oppR){
 let diff=myR-oppR; // roughly -30..+30
 let myXG=Math.max(0.25,Math.min(4.2,1.35+diff/14));
 let oppXG=Math.max(0.25,Math.min(4.2,1.35-diff/14));
 return {myXG,oppXG};
}
// Pick a scorer from the squad, weighted heavily toward attacking positions & star quality.
function pickScorer(){
 let weights=squad.map(p=>{
  let posW = p.pos==='FW' ? 5 : p.pos==='MF' ? 2 : p.pos==='DF' ? 0.5 : p.pos==='GK' ? 0.04 : 1;
  let starW = p.star ? 1.6 : 1;
  let energyW = (p.energy||90)/100;
  return posW*starW*energyW;
 });
 let total=weights.reduce((a,b)=>a+b,0);
 let r=Math.random()*total;
 for(let i=0;i<squad.length;i++){ r-=weights[i]; if(r<=0) return squad[i]; }
 return squad[squad.length-1];
}
// Live match state, built fresh each kickoff from real ratings (not scripted).
let match=null;
function buildMatchEvents(myXG,oppXG){
 // Turn expected-goals totals into per-minute probabilities, then roll 90 minutes once at kickoff
 // so the "live" playback just replays a schedule of real goal-minute events.
 let events=[];
 let myProb=myXG/90, oppProb=oppXG/90;
 for(let min=1;min<=90;min++){
  if(Math.random()<myProb) events.push({min,side:'me'});
  if(Math.random()<oppProb) events.push({min,side:'opp'});
 }
 events.sort((a,b)=>a.min-b.min);
 return events;
}

 let sorted=Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS);
 let tierLabel=fixtures[0]?.tier||'RoW L1';
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Table - ${myTeam} #${sorted.findIndex(e=>e[0]===myTeam)+1} - ${season} - ${tierLabel} - 16 teams</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab on'>Table ${tierLabel} 16</div><div class='tab' onclick='renderPromo()'>Promo RoW L1-L2</div></div><div class='dark-card'><div class='row' style='font-weight:800'><div># Team ${tierLabel} (16)</div><div>P W-D-L PTS</div></div>${sorted.map((e,i)=>`<div class='row' style='${e[0]===myTeam?'background:#22c55e22':''}'><div>${i+1}. ${e[0]} <span class='xg'>${opponentRating(e[0])}</span></div><div>${e[1].P} ${e[1].W}-${e[1].D}-${e[1].L} ${e[1].PTS}</div></div>`).join('')}</div><div class='dark-card small'><div style='color:#22c55e'>Numbers next to each team are their club rating, used by the match engine to weight goal chances.</div>Promotion: bottom 2 → RoW L2, RoW L2 top 2 → RoW L1</div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>📊</div><div class='bicon' onclick='home()'>🏠</div></div>`;
}
function renderPromo(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Promotion - RoW L1-L2 + Tier 1-2 - ${season} - 32 teams RoW</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab' onclick='renderTableFull()'>Table</div><div class='tab on'>Promo RoW 32</div></div><div class='dark-card'><div style='color:#22c55e;font-weight:800'>RoW - 32 TEAMS (16+16):</div><div class='row'><div>RoW League 1 (16) → Bottom 2 to RoW L2</div></div><div class='row'><div>RoW League 2 (16) → Top 2 to RoW L1</div></div></div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>⬆️⬇️</div><div class='bicon' onclick='home()'>🏠</div></div>`;
}
function renderFixturesFull(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e'>Fixtures - ${fixtures[0]?.tier||'RoW L1'} - 16 teams - RoW 32 total</div></div><div class='tabBar'><div class='tab' onclick='renderSquad()'>Squad</div><div class='tab on'>Fix ${fixtures[0]?.tier||'RoW L1'} 16</div><div class='tab' onclick='renderPromo()'>Promo</div></div><div class='dark-card'>${fixtures.map(f=>`<div class='row'><div><span class='badge'>${f.comp}</span> <span class='badge2'>${f.tier}</span> GW${f.gw} ${f.home} ${f.played?f.mg+'-'+f.og:'vs'} ${f.away}<br><span class='small'>${f.date||''}</span></div><div>${f.played?f.res:'UP'}</div></div>`).join('')}</div><div class='bottom'><div class='bicon' onclick='renderSquad()'>⚽</div><div class='bicon active'>📅</div></div>`;
}
function openPopup(type){
 let el=document.getElementById('popup'); if(!el){ let d=document.createElement('div'); d.id='popup'; document.getElementById('app').appendChild(d); el=d; }
 if(type==='tactics'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderLineup()'>Lineup 4-4-2 - GW${currentRound} - ${season}</div><div class='pitem' onclick='renderTableFull()'>Show all teams - 16 teams</div><div class='pitem' onclick='renderPromo()'>Promotion - RoW L1-L2 - 32 teams</div></div>`; }
 else if(type==='fixtures'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderTableFull()'>Standing - ${season}</div><div class='pitem' onclick='renderFixturesFull()'>Your Fixtures - ${fixtures.filter(f=>!f.played).length} left</div><div class='pitem' onclick='renderPromo()'>RoW L1-L2 - 32 teams (16+16)</div></div>`; }
 else if(type==='trophy'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderTableFull()'>Teams Ranking</div><div class='pitem' onclick='renderPromo()'>Promotion Table</div></div>`; }
 else if(type==='settings'){ el.innerHTML=`<div class='popup'><div class='pitem' onclick='saveSeason();alert("Saved")'>Save game</div><div class='pitem' onclick='home()'>Main menu</div><div class='pitem'>About 10.6 - real club squads (32 RoW teams) + stat-driven match engine</div></div>`; }
}
function renderLineup(){
 let lineup=squad.slice(0,11);
 let next=fixtures.find(f=>f.gw===currentRound);
 let opp=next?(next.home===myTeam?next.away:next.home):'Flamengo';
 let myR=squadRating(), oppR=opponentRating(opp);
 let {myXG,oppXG}=expectedGoals(myR,oppR);
 document.getElementById('app').innerHTML=`<div class='top'><div class='top1'><div>Lineup 4-4-2 GW${currentRound} - ${season} - ${fixtures[0]?.tier||'RoW L1'}</div><div><button class='btn' style='width:auto;padding:4px 8px' onclick='renderSquad()'>Back</button></div></div><div class='small' style='color:#22c55e'>vs ${opp} (rating ${oppR}) • Your rating ${myR.toFixed(1)} • Projected xG ${myXG.toFixed(2)}-${oppXG.toFixed(2)}</div></div><div style='display:flex'><div style='flex:1'>${lineup.map(p=>`<div class='row'><div><div class='pos'>${p.pos}</div><div style='font-weight:700'>${p.n} ${p.star?'★':''}</div></div><div class='ovr'>${p.ovr}</div></div>`).join('')}</div><div style='width:130px;background:#1e293b;padding:6px'><button class='btn' style='margin-top:20px;background:#22c55e' onclick='startLive()'>Play GW${currentRound}</button></div></div>`;
}
function startLive(){
 let next=fixtures.find(f=>f.gw===currentRound);
 let opp=next?(next.home===myTeam?next.away:next.home):'Flamengo';
 let myR=squadRating(), oppR=opponentRating(opp);
 let {myXG,oppXG}=expectedGoals(myR,oppR);
 let events=buildMatchEvents(myXG,oppXG);
 match={opp,myR,oppR,myXG,oppXG,events,idx:0};
 liveMinute=0; scoreA=0; scoreB=0; scorersA=[]; scorersB=[];
 renderLive();
 let iv=setInterval(()=>{
  liveMinute++;
  while(match.idx<match.events.length && match.events[match.idx].min<=liveMinute){
   let ev=match.events[match.idx];
   if(ev.side==='me'){ scoreA++; let scorer=pickScorer(); stats[scorer.n]=stats[scorer.n]||{g:0,cs:0}; stats[scorer.n].g++; scorersA.push(scorer.n+" "+ev.min+"'"); }
   else { scoreB++; scorersB.push(match.opp+" "+ev.min+"'"); }
   match.idx++;
  }
  if(liveMinute===45){ clearInterval(iv); renderHalf(); return; }
  if(liveMinute>=90){ clearInterval(iv); finishMatch(); return; }
  renderLive();
 },180);
}
function renderLive(){
 let opp=match?match.opp:'Flamengo';
 document.getElementById('app').innerHTML=`<div class='top'><div>${fixtures.find(f=>f.gw===currentRound)?.comp||'RoW League 1'} - GW${currentRound} - ${season}</div><div class='clock'>${liveMinute}'</div></div><div class='liveTop'><div class='scoreBox'><div class='tA'>${myTeam}</div><div class='sc'>${scoreA}-${scoreB}</div><div class='tB'>${opp}</div></div></div><div class='mini' style='padding:4px 8px'>${[...scorersA,...scorersB].join(" ")}</div><div class='liveCard'><div style='text-align:center;color:#22c55e;font-weight:800'>Live GW${currentRound} - ${season} - ${fixtures[0]?.tier||'RoW L1'}</div><div class='row' style='background:#22c55e22'><div style='flex:1;text-align:right'>${myTeam}</div><div style='width:60px;text-align:center;font-weight:800'>${scoreA}-${scoreB}</div><div style='flex:1'>${opp}</div></div><div class='xg' style='padding:4px'>Ratings: ${myTeam} ${match?match.myR.toFixed(1):'-'} vs ${opp} ${match?match.oppR:'-'} • xG ${match?match.myXG.toFixed(2):'-'}-${match?match.oppXG.toFixed(2):'-'}</div></div>`;
}
function renderHalf(){
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;width:100%;color:#22c55e;font-weight:800'>Half-Time GW${currentRound} - ${season}</div></div><div class='liveTop'><div style='flex:1;text-align:center'>${myTeam}</div><div style='flex:0 0 130px;text-align:center'><div style='background:#fff;color:#000;padding:4px'>Match info</div><div style='font-size:20px;font-weight:900'>${scoreA}-${scoreB}</div><div style='font-size:10px'>${[...scorersA,...scorersB].join("<br>")}</div></div><div style='flex:1;text-align:center'>${match?match.opp:'Flamengo'}</div></div><button class='btn' style='position:fixed;bottom:0;left:0;right:0;border-radius:0' onclick='resumeSecondHalf()'>Back to match</button>`;
}
function resumeSecondHalf(){
 liveMinute=45; renderLive();
 let iv=setInterval(()=>{
  liveMinute++;
  while(match.idx<match.events.length && match.events[match.idx].min<=liveMinute){
   let ev=match.events[match.idx];
   if(ev.side==='me'){ scoreA++; let scorer=pickScorer(); stats[scorer.n]=stats[scorer.n]||{g:0,cs:0}; stats[scorer.n].g++; scorersA.push(scorer.n+" "+ev.min+"'"); }
   else { scoreB++; scorersB.push(match.opp+" "+ev.min+"'"); }
   match.idx++;
  }
  if(liveMinute>=90){ clearInterval(iv); finishMatch(); }
  else renderLive();
 },140);
}
function finishMatch(){
 let next=fixtures.find(f=>f.gw===currentRound);
 if(next){
  next.played=true; next.mg=scoreA; next.og=scoreB;
  next.res=scoreA>scoreB?'W':scoreA<scoreB?'L':'D';
  let t=table[myTeam];
  if(t){ t.P++; t.GF+=scoreA; t.GA+=scoreB; if(scoreA>scoreB){t.W++; t.PTS+=3;} else if(scoreA<scoreB){t.L++;} else {t.D++; t.PTS++;} if(scoreB===0) t.CS++; }
  let ot=table[match?match.opp:next.away===myTeam?next.home:next.away];
  if(ot){ ot.P++; ot.GF+=scoreB; ot.GA+=scoreA; if(scoreB>scoreA){ot.W++; ot.PTS+=3;} else if(scoreB<scoreA){ot.L++;} else {ot.D++; ot.PTS++;} }
 }
 currentRound++; saveSeason();
 let resultWord=scoreA>scoreB?'WIN':scoreA<scoreB?'LOSS':'DRAW';
 document.getElementById('app').innerHTML=`<div class='top'><div style='text-align:center;color:#22c55e;width:100%'>Round results GW${currentRound-1} - ${season}</div></div><div class='liveCard'><div class='row' style='background:#22c55e22'><div style='flex:1;text-align:right'>${myTeam}</div><div style='width:50px;text-align:center;font-weight:900'>${scoreA}-${scoreB}</div><div style='flex:1'>${match?match.opp:''} - ${resultWord}</div></div><div class='small' style='padding:4px'>${[...scorersA,...scorersB].join(" ")||'No goals'}</div></div><div style='position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px;background:#000'><button class='btn' style='width:33%;background:#334155;color:#fff' onclick='renderTableFull()'>Table</button><button class='btn' style='width:33%' onclick='renderSquad()'>Continue GW${currentRound}</button><button class='btn' style='width:33%;background:#facc15;color:#000' onclick='renderLineup()'>Next</button></div>`;
}
home();
</script></body></html>
