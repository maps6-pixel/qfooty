<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>QFooty Manager - Stage 2.1 Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
header{position:sticky;top:0;background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;z-index:10}
.logo{font-weight:900;color:#22c55e;font-size:20px}.logo span{color:#fff}
.btn{background:#22c55e;color:#000;border:0;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;background:#1e293b;padding:6px;position:sticky;top:49px;z-index:9;overflow:auto}
.tab{padding:8px 12px;border-radius:6px;opacity:.6;cursor:pointer;white-space:nowrap}.tab.active{background:#22c55e;color:#000;opacity:1;font-weight:700}
.card{background:#1e293b;margin:10px;padding:12px;border-radius:12px;border:1px solid #334155}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff12}
.badge{background:#22c55e;color:#000;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px}
.small{font-size:12px;opacity:.7}
.start11{border-left:3px solid #22c55e;padding-left:6px}
</style>
</head>
<body>
<header><div class='logo'><span>Q</span>Footy Manager</div><div id='dateLabel'>Aug 9 2025</div><button class='btn' onclick='nextDay()'>Next Day ▶</button></header>
<div class='tabs'>
<div class='tab active' onclick="showTab('dash',this)">Dashboard</div>
<div class='tab' onclick="showTab('squad',this)">Squad</div>
<div class='tab' onclick="showTab('tables',this)">Tables</div>
<div class='tab' onclick="showTab('match',this)">Match</div>
</div>
<div id='dash'></div><div id='squad' style='display:none'></div><div id='tables' style='display:none'></div><div id='match' style='display:none'></div>
<script>
const TEAMS={
"Rest of World 2":["Mamelodi Sundowns","Kaizer Chiefs","Orlando Pirates","Al Ahly","Wydad AC","Al Nassr","Al Hilal","Al Ittihad","Inter Miami","LAFC","Flamengo","River Plate","Boca Juniors","Simba SC","TP Mazembe","Esperance"],
"Rest of World PL":["Galatasaray","Fenerbahce","Ajax","PSV","Benfica","Porto","Sporting","Celtic","Rangers","Club Brugge","Shakhtar","RB Salzburg","Young Boys","FC Copenhagen","Sparta Prague","Dinamo Zagreb"],
"Premier League":["Man City","Arsenal","Liverpool","Chelsea","Man Utd","Newcastle","Tottenham","Aston Villa","Brighton","West Ham","Crystal Palace","Fulham","Wolves","Everton","Brentford","Nottm Forest","Bournemouth","Luton","Sheffield Utd","Burnley"],
"La Liga":["Real Madrid","Barcelona","Atletico Madrid","Sevilla","Real Sociedad","Villarreal","Betis","Athletic Bilbao","Valencia","Osasuna","Celta","Rayo Vallecano","Mallorca","Girona","Getafe","Las Palmas","Alaves","Cadiz","Granada","Almeria"]
};
const STARS={"Inter Miami":{name:"L. Messi",ovr:90,pos:"FW"},"Al Nassr":{name:"C. Ronaldo",ovr:89,pos:"FW"},"Man City":{name:"E. Haaland",ovr:89,pos:"FW"},"Real Madrid":{name:"K. Mbappe",ovr:90,pos:"FW"},"Mamelodi Sundowns":{name:"T. Zwane",ovr:78,pos:"MID"}};
let gameDate=new Date(2025,7,9); let myTeam="Mamelodi Sundowns"; let db={}; let subsUsed=0; let matchLog=[]; let pendingOut=null;
function genSquad(team){
 let arr=[]; let star=STARS[team];
 if(star) arr.push({id:1,name:star.name,ovr:star.ovr,pos:star.pos,isGK:false,isStar:true,isStarting:true});
 let posSeq=["GK","DEF","DEF","DEF","DEF","MID","MID","MID","FW","FW","FW","GK","DEF","MID","MID","FW","DEF","MID","FW","DEF","MID","FW"];
 let id=arr.length+1;
 for(let p of posSeq){ if(arr.length>=22) break;
   let ovr=team===myTeam?70+Math.floor(Math.random()*10):62+Math.floor(Math.random()*14);
   if(arr.length<11) ovr+=3;
   arr.push({id:id++,name:"Player "+id,pos:p,ovr:Math.min(90,ovr),isGK:p==="GK",isStar:false,isStarting:arr.length<11});
 }
 let bench=arr.filter(x=>!x.isStarting);
 if(!bench.some(x=>x.isGK)){ arr[12].pos="GK"; arr[12].isGK=true; }
 return arr;
}
function init(){
 Object.keys(TEAMS).forEach(lg=>TEAMS[lg].forEach(t=>{ db[t]=genSquad(t); }));
 renderAll();
}
function renderAll(){
 document.getElementById('dateLabel').innerText=gameDate.toDateString();
 let sq=db[myTeam]; if(!sq) return;
 let avg=Math.round(sq.reduce((a,b)=>a+b.ovr,0)/sq.length);
 let star=sq.sort((a,b)=>b.ovr-a.ovr)[0];
 document.getElementById('dash').innerHTML=`<div class='card'><h3>Welcome to ${myTeam}</h3><div class='small'>Date: ${gameDate.toDateString()} - Season 2025/26</div><div style='margin-top:8px'>Budget: <b>$45M</b> | Squad: ${sq.length} | Avg OVR: ${avg}</div></div><div class='card'><h3>Next Match</h3><div>${myTeam} vs Galatasaray - Tomorrow 15:00</div><div style='margin-top:8px'><button class='btn' onclick="showTab('match',document.querySelectorAll('.tab')[3])">Play Match</button></div></div><div class='card'><h3>Top Star ⭐ ${star.name} - OVR ${star.ovr}</h3><div class='small'>Stage 2.1 FIXED - Stage1 restored + Bench + 5 subs</div></div>`;
 let starting=sq.filter(s=>s.isStarting); let bench=sq.filter(s=>!s.isStarting);
 document.getElementById('squad').innerHTML=`<div class='card'><h3>Starting XI (${starting.length})</h3>${starting.map(p=>`<div class='row start11'><div>${p.pos} ${p.name} ${p.isStar?'<span class=badge>STAR</span>':''} ${p.isGK?'🧤':''}</div><div><b>${p.ovr}</b> <button onclick='toBench(${p.id})'>Bench</button></div></div>`).join('')}</div><div class='card'><h3>Bench (${bench.length}/9) - Need 1 GK 🧤 = ${bench.filter(x=>x.isGK).length}</h3>${bench.map(p=>`<div class='row'><div>${p.pos} ${p.name} ${p.isGK?'🧤':''}</div><div><b>${p.ovr}</b> <button onclick='toStarting(${p.id})'>Start</button></div></div>`).join('')}</div>`;
 let htmlT=""; Object.entries(TEAMS).forEach(([lg,list])=>{ htmlT+=`<div class='card'><h3>${lg}</h3>${list.map(t=>`<div class='row'><div>${t} ${t===myTeam?'<span class=badge>YOU</span>':''}</div><div class='small'>${db[t]?Math.round(db[t].reduce((a,b)=>a+b.ovr,0)/db[t].length):'--'} OVR</div></div>`).join('')}</div>`; }); document.getElementById('tables').innerHTML=htmlT;
 document.getElementById('match').innerHTML=`<div class='card'><h3>Match Center - ${myTeam} vs Galatasaray</h3><div class='small'>Subs used: ${subsUsed}/5 | ${pendingOut?'Pending out: '+db[myTeam].find(x=>x.id===pendingOut).name:'Click Sub Out then Sub In'}</div><div style='margin:8px 0;display:flex;gap:8px'><button class='btn' onclick='play()'>Kick Off ⚽</button><button class='btn' style='background:#334155;color:#fff' onclick='resetSubs()'>Reset Subs</button></div><div style='display:flex;gap:8px'><div style='flex:1' class='card'><div class='small'>On Pitch</div>${starting.map(p=>`<div class='row'><div>${p.pos} ${p.name}</div><button onclick='subOut(${p.id})'>Out</button></div>`).join('')}</div><div style='flex:1' class='card'><div class='small'>Bench</div>${bench.map(p=>`<div class='row'><div>${p.pos} ${p.name} ${p.isGK?'🧤':''}</div><button onclick='subIn(${p.id})'>In</button></div>`).join('')}</div></div><div class='small' style='margin-top:8px'>${matchLog.length?matchLog.join('<br>'):'No match yet. Use Sub Out -> Sub In for 5 subs.'}</div></div>`;
}
function toBench(id){ let s=db[myTeam].find(x=>x.id===id); if(s) s.isStarting=false; renderAll(); }
function toStarting(id){ let sq=db[myTeam]; if(sq.filter(x=>x.isStarting).length>=11){ alert('XI full - bench one first'); return; } let s=sq.find(x=>x.id===id); if(s) s.isStarting=true; renderAll(); }
function subOut(id){ pendingOut=id; renderAll(); }
function subIn(id){ if(subsUsed>=5){ alert('5/5 subs used!'); return; } if(pendingOut==null){ alert('Click Out first'); return; } let sq=db[myTeam]; let out=sq.find(x=>x.id===pendingOut); let inn=sq.find(x=>x.id===id); out.isStarting=false; inn.isStarting=true; subsUsed++; matchLog.push(`🔄 ${subsUsed}/5 Sub: ${out.name} OFF → ${inn.name} ON`); pendingOut=null; renderAll(); }
function resetSubs(){ subsUsed=0; matchLog=[]; pendingOut=null; renderAll(); }
function play(){ let s=Math.floor(Math.random()*4); let c=Math.floor(Math.random()*3); matchLog.push(`⚽ ${myTeam} ${s}-${c} Galatasaray`); renderAll(); }
function nextDay(){ gameDate.setDate(gameDate.getDate()+1); renderAll(); }
function showTab(id,el){ document.querySelectorAll('#dash,#squad,#tables,#match').forEach(d=>d.style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
init();
</script>
</body>
</html>
