<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>QFooty 8.0 FINAL CYBER</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#e2e8f0;font-family:system-ui;padding-bottom:70px}
.top{background:#1e293b;border-bottom:3px solid #22c55e;padding:6px 8px;font-size:12px}
.top1{display:flex;justify-content:space-between}.gold{color:#facc15;font-weight:800}.teal{background:#0f766e;padding:4px 8px;border-radius:4px;display:inline-block;font-weight:800}
.bar{height:8px;background:#334155;border-radius:4px;overflow:hidden;width:80px;display:inline-block}.bar div{height:100%;background:#22c55e}
.squad-head{background:#0f172a;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;font-size:12px}
.row{background:#1a2744;border-bottom:1px solid #ffffff0f;padding:7px 6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.row:hover{background:#1e334f}
.pos{font-weight:800;color:#22c55e;width:32px}.name{font-weight:700}.val{font-size:10px;opacity:.7}.ovr{font-size:16px;font-weight:900}.star{color:#ef4444}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0f1e;border-top:2px solid #22c55e;display:flex;justify-content:space-around;padding:6px 0;z-index:20}
.bicon{width:48px;height:48px;background:#1e293b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:1px solid #334155}.bicon.active{background:#22c55e;color:#000}
.popup{position:fixed;bottom:70px;right:6px;background:#1e293b;border:1px solid #22c55e;border-radius:8px;min-width:220px;z-index:30;box-shadow:0 10px 30px #000}
.pitem{padding:12px 14px;border-bottom:1px solid #ffffff11;cursor:pointer;font-size:14px}.pitem:hover{background:#22c55e;color:#000}
.btn{background:#22c55e;color:#000;border:0;padding:10px 16px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}
.btnGold{background:#facc15;color:#000}
.select{background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;width:100%;margin:4px 0}
.liveTop{background:#1e293b;padding:8px;display:flex;justify-content:space-between;align-items:center}
.scoreBox{display:flex;align-items:center;gap:4px;width:100%}.tA{background:#0f766e;color:#fff;padding:8px 6px;border-radius:4px;flex:1;text-align:center;font-weight:800;font-size:14px}.tB{background:#dc2626;color:#fff;padding:8px 6px;border-radius:4px;flex:1;text-align:center;font-weight:800;font-size:14px}.sc{font-size:22px;font-weight:900;padding:0 8px}
.clock{width:48px;height:48px;border:3px solid #facc15;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.liveCard{background:#1a2744;margin:6px;padding:8px;border-radius:8px;border:1px solid #334155}
.mini{font-size:11px;opacity:.8}.rating{width:32px;text-align:right;font-weight:800}
</style></head><body>
<div id='app'></div>
<script>
const BUDGETS={"Chelsea":200,"Man City":250,"Kaizer Chiefs":8,"Mamelodi Sundowns":12,"Orlando Pirates":8,"Real Madrid":300,"Liverpool":170};
let myTeam=localStorage.getItem('qfooty_team')||'Chelsea';
let coach=localStorage.getItem('coach')||'Given';
let budget=parseInt(localStorage.getItem('qfooty_b_'+myTeam)||BUDGETS[myTeam]||60);
let day=22; let month=6; let year=22;
let confidenceC=100, confidenceS=100;
let squad=[
{n:"Logen",pos:"GK",age:18,energy:100,val:"92M 80k",sal:"384 k",flag:"🇩🇪",ovr:74,star:1,g:0,cs:0},
{n:"Precious",pos:"GK",age:19,energy:100,val:"58M 806k",sal:"334 k",flag:"🏴󐁧󐁢󐁥󐁮󐁧󐁿",ovr:65,star:1,g:0,cs:0},
{n:"Kimberley",pos:"WBL",age:17,energy:93,val:"87M 393k",sal:"388 k",flag:"🇭🇷",ovr:72,star:1,g:0,cs:0},
{n:"Kuziva",pos:"WBR",age:19,energy:100,val:"83M 872k",sal:"382 k",flag:"🇵🇹",ovr:71,card:"🟨",g:0,cs:0},
{n:"Nancy",pos:"WBL",age:19,energy:100,val:"35M 587k",sal:"348 k",flag:"🇪🇬",ovr:65,star:1,g:0,cs:0},
{n:"Lorraine",pos:"WBR",age:19,energy:100,val:"33M 292k",sal:"337 k",flag:"🇲🇽",ovr:62,star:1,g:0,cs:0},
{n:"Chelsea",pos:"CDL",age:16,energy:91,val:"98M 537k",sal:"407 k",flag:"🇧🇪",ovr:76,card:"🟨",g:0,cs:0},
{n:"Faith",pos:"CDR",age:18,energy:100,val:"55M 389k",sal:"395 k",flag:"🇦🇷",ovr:74,inj:"2",g:0,cs:0},
{n:"Dephine",pos:"CDR",age:18,energy:100,val:"63M 154k",sal:"356 k",flag:"🏴󐁧󐁢󐁥󐁮󐁧󐁿",ovr:67,star:1,g:0,cs:0},
{n:"Chiedza",pos:"CDR",age:19,energy:100,val:"45M 200k",sal:"300 k",flag:"🇿🇼",ovr:68,star:1,g:0,cs:0},
{n:"Palmer",pos:"ATT",age:22,energy:98,val:"85M",sal:"450 k",flag:"🏴󐁧󐁢󐁥󐁮󐁧󐁿",ovr:86,star:1,g:0,cs:0},
{n:"Tariro",pos:"OM",age:20,energy:96,val:"40M",sal:"320 k",flag:"🇿🇼",ovr:73,g:0,cs:0},
{n:"Blessed",pos:"F",age:19,energy:100,val:"50M",sal:"340 k",flag:"🇿🇦",ovr:75,g:0,cs:0},
];
let lineup=[], subs=[], formation="4-4-2";
let liveMinute=0, scoreA=0, scoreB=0, scorersA=[], statsA={poss:73,att:13,on:5,rec:7}, statsB={poss:27,att:6,on:1,rec:7};
let fixtures=[{h:"Burnley",a:"Manchester City",r:"0-2"},{h:"Quatracul CF",a:"Liverpool",r:"3-0"},{h:"Norwich City",a:"Chelsea",r:"0-3"},{h:"Brighton",a:"Manchester United",r:"2-1"},{h:"Brentford",a:"Tottenham",r:"1-1"},{h:"Everton",a:"Wolverhampton",r:"0-3"},{h:"Crystal Palace",a:"West Ham",r:"1-1"},{h:"Aston Villa",a:"Leicester City",r:"3-1"}];
let table={"Quatracul CF":30,"Liverpool":28,"Chelsea":27,"Man City":26};

function renderSquad(){
 let nextOpp="Liverpool (3rd)";
 document.getElementById('app').innerHTML=`
 <div class='top'>
  <div class='top1'><div><div class='teal'>${myTeam} (1st)</div><div>${coach}</div><div class='gold'>Next match</div><div>League - 1st D - ${day}nd round<br>Home - ${nextOpp}</div></div>
  <div style='text-align:right'><div>${month}/${day}/${year}</div><div>Chairman confidence <div class='bar'><div style='width:${confidenceC}%'></div></div> ${confidenceC}%</div><div>Supporters confidence <div class='bar'><div style='width:${confidenceS}%'></div></div> ${confidenceS}%</div><div style='margin-top:6px;font-weight:900'>$${budget}M 695k</div></div></div>
 </div>
 <div class='squad-head'><div>👤 ${squad.length}</div><div>Order by</div><select class='select' style='width:120px'><option>Position</option></select></div>
 <div>${squad.map(p=>`<div class='row'><div style='display:flex;gap:8px;align-items:center'><div class='pos'>${p.pos}</div><div><div class='name'>${p.n} ${p.star?'<span class="star">★</span>':''}</div><div class='val'>${p.val} (Sal: ${p.sal})<br>${p.flag} Age: ${p.age} Energy: ${p.energy}% ${p.card||''} ${p.inj?'💢'+p.inj:''}</div></div></div><div style='display:flex;gap:8px;align-items:center'><div class='ovr'>${p.ovr}</div><div>👤</div></div></div>`).join('')}</div>
 <div id='popup'></div>
 <div class='bottom'>
  <div class='bicon active' onclick='renderSquad()'>⚽</div>
  <div class='bicon' onclick='openPopup("tactics")'>📋</div>
  <div class='bicon' onclick='openPopup("fixtures")'>📅</div>
  <div class='bicon' onclick='openPopup("trophy")'>🏆</div>
  <div class='bicon' onclick='openPopup("settings")'>⚙️</div>
 </div>`;
}
function openPopup(type){
 let el=document.getElementById('popup');
 if(type==='tactics'){
  el.innerHTML=`<div class='popup'><div class='pitem' onclick='renderLineup()'>Lineup 4-4-2 - Play next match</div><div class='pitem' onclick='alert("Show all teams")'>Show all teams</div><div class='pitem'>Stadium</div><div class='pitem'>Youth Squad</div><div class='pitem'>Search</div><div class='pitem'>Finances $58M</div></div>`;
 } else if(type==='fixtures'){
  el.innerHTML=`<div class='popup'><div class='pitem'>Standing and fixtures</div><div class='pitem'>Your Fixtures</div><div class='pitem'>Friendly Schedule</div></div>`;
 } else if(type==='trophy'){
  el.innerHTML=`<div class='popup'><div class='pitem'>Teams Ranking</div><div class='pitem'>Coaches Ranking</div><div class='pitem'>Champions</div><div class='pitem'>Top Scorer - Palmer 8 goals</div><div class='pitem'>MVP Round</div><div class='pitem'>MVP year</div></div>`;
 } else if(type==='settings'){
  el.innerHTML=`<div class='popup'><div class='pitem' onclick='localStorage.setItem("qfooty_save_"+Date.now(),JSON.stringify({team:myTeam}));alert("Game saved!")'>Save game</div><div class='pitem'>Settings</div><div class='pitem' onclick='if(confirm("Resign?")) location.reload()'>Resign</div><div class='pitem' onclick='location.reload()'>Main menu</div><div class='pitem'>About QFooty 8.0</div><div class='pitem'>Remove ads</div></div>`;
 } else { el.innerHTML=''; }
}
function renderLineup(){
 lineup=squad.slice(0,11); subs=squad.slice(11);
 document.getElementById('app').innerHTML=`
 <div class='top'><div class='top1'><div>Lineup (${formation})</div><div><button class='btn' style='width:auto;padding:4px 8px' onclick='renderSquad()'>Back</button></div></div></div>
 <div style='display:flex'><div style='flex:1'>
  ${lineup.map(p=>`<div class='row'><div><div class='pos'>${p.pos.startsWith("GK")?"GK":p.pos.startsWith("W")||p.pos.includes("D")?"DEF":p.pos.includes("M")?"MID":"ATT"}</div><div class='name'>${p.n}</div><div class='mini'>${p.pos} ${p.flag}</div></div><div style='text-align:right'><div class='ovr'>${p.ovr}</div><div class='mini'>${p.energy}%</div></div></div>`).join('')}
  <div style='padding:6px;font-weight:800;background:#0f766e'>SUBS</div>
  ${subs.map(p=>`<div class='row' style='opacity:.8'><div><div class='pos'>SUB</div><div class='name'>${p.n}</div><div class='mini'>${p.pos}</div></div><div><div>${p.ovr}</div><div class='mini'>${p.energy}%</div></div></div>`).join('')}
 </div>
 <div style='width:140px;background:#1e293b;padding:6px'>
  <div style='display:flex;gap:4px'><div style='background:#22c55e;color:#000;padding:6px;border-radius:6px;flex:1;text-align:center'>⇄</div><div style='background:#fff;color:#000;padding:6px;border-radius:6px;flex:1;text-align:center'>📋</div><div style='background:#facc15;padding:6px;border-radius:6px;flex:1'>🎽</div></div>
  <select class='select' id='formSel' onchange='formation=this.value'><option>4-4-2</option><option>4-3-3</option><option>3-5-2</option></select>
  <div style='margin-top:10px;font-weight:800;color:#facc15'>Available players</div>
  <div>${squad.slice(0,5).map(p=>`<div class='row' style='font-size:10px'><div>${p.n}<br>${p.pos}</div><div>${p.ovr} ★<br>⚡${p.energy}%</div></div>`).join('')}</div>
  <button class='btn btnGold' style='position:fixed;bottom:70px;right:6px;width:140px' onclick='startLive()'>Play match</button>
 </div></div>`;
}
function startLive(){
 liveMinute=0; scoreA=0; scoreB=0; scorersA=[];
 renderLive(); let iv=setInterval(()=>{
  liveMinute++;
  if(liveMinute===8){ scoreA=1; scorersA.push("Chelsea 8'"); }
  if(liveMinute===36){ scoreA=2; scorersA.push("Tariro 36'"); }
  if(liveMinute===53){ scoreA=3; scorersA.push("Blessed 53'"); }
  if(liveMinute===45){ clearInterval(iv); renderHalf(); return; }
  if(liveMinute>=90){ clearInterval(iv); renderFull(); return; }
  renderLive();
 }, 200);
 setTimeout(()=>{ liveMinute=11; renderLive(); }, 400);
 setTimeout(()=>{ liveMinute=43; scoreA=2; scorersA=["Chelsea 8'","Tariro 36'"]; renderLive(); }, 1200);
}
function renderLive(){
 document.getElementById('app').innerHTML=`
 <div class='top'><div>League - 1st D<br>${day}nd round</div><div class='clock'>${liveMinute}'</div></div>
 <div class='liveTop'><div class='scoreBox'><div class='tA'>${myTeam}</div><div class='sc'>${scoreA}-${scoreB}</div><div class='tB'>Liverpool</div></div></div>
 <div class='mini' style='padding:4px 8px'>⚽ ${scorersA.join(" ")}</div>
 <div class='liveCard'><div style='text-align:center;color:#facc15;font-weight:800'>Live results</div>
  <div style='text-align:center;font-weight:800;margin:6px 0'>1st division</div>
  ${fixtures.map(f=>`<div class='row' style='background:transparent;border:0;padding:2px 0'><div style='flex:1;text-align:right'>${f.h}</div><div style='width:60px;text-align:center;font-weight:800'>${f.h.includes("Quatracul")||f.h===myTeam?scoreA+"-"+scoreB:f.r}</div><div style='flex:1'>${f.a}</div></div>`).join('')}
  <div style='text-align:center;font-weight:800;margin:6px 0'>2nd division</div>
  <div class='row' style='background:transparent;border:0;padding:2px 0'><div style='flex:1;text-align:right'>Blackpool</div><div style='width:60px;text-align:center'>0-0</div><div style='flex:1'>Swansea</div></div>
  <div class='row' style='background:transparent;border:0;padding:2px 0'><div style='flex:1;text-align:right'>Watford</div><div style='width:60px;text-align:center'>0-0</div><div style='flex:1'>Huddersfield</div></div>
 </div>`;
}
function renderHalf(){
 document.getElementById('app').innerHTML=`
 <div class='top'><div style='text-align:center;width:100%;color:#facc15'>Half-Time</div></div>
 <div class='liveTop'><div style='flex:1;text-align:center'>${myTeam}</div><div style='flex:0 0 120px;text-align:center'><div style='background:#fff;color:#000;padding:4px'>Match info</div><div style='margin-top:4px'>2-0</div><div style='font-size:10px'>🏟️ Quatracul Arena<br>👥 74208<br>💰 1M 186k<br>⚽ Chelsea 8'<br>⚽ Tariro 36'</div></div><div style='flex:1;text-align:center'>Liverpool</div></div>
 <div class='liveCard'>
  <div class='row'><div>73%</div><div style='color:#facc15'>ball possession</div><div>27%</div></div>
  <div class='row'><div>13</div><div style='color:#facc15'>Attempts</div><div>6</div></div>
  <div class='row'><div>5</div><div style='color:#facc15'>On-target</div><div>1</div></div>
  <div class='row'><div>7</div><div style='color:#facc15'>Balls recovered</div><div>7</div></div>
 </div>
 <button class='btn btnGold' style='position:fixed;bottom:0;left:0;right:0;border-radius:0' onclick='resumeSecondHalf()'>Back to match</button>`;
}
function resumeSecondHalf(){
 liveMinute=45; renderLive(); let iv=setInterval(()=>{ liveMinute++; if(liveMinute>=90){ clearInterval(iv); renderFull(); } else renderLive(); }, 150);
}
function renderFull(){
 document.getElementById('app').innerHTML=`
 <div class='top'><div style='text-align:center;color:#facc15;width:100%'>Round results</div><div style='text-align:center'>🏴󐁧󐁢󐁥󐁮󐁧󐁿 England ⬇️<br>22nd round<br><b>1st division</b></div></div>
 <div class='liveCard'>
  ${fixtures.map(f=>`<div class='row' style='background:transparent'><div style='flex:1;text-align:right'>${f.h}</div><div style='width:50px;text-align:center;font-weight:800'>${f.r}</div><div style='flex:1'>${f.a}</div></div>`).join('')}
  <div style='text-align:center;margin-top:8px'><b>2nd division</b></div>
  <div class='row' style='background:transparent'><div style='flex:1;text-align:right'>Blackpool</div><div style='width:50px;text-align:center'>0-2</div><div style='flex:1'>Swansea</div></div>
 </div>
 <div style='display:flex;background:#0f172a;border-top:2px solid #22c55e'>
  <div style='flex:1;padding:6px'><div class='teal'>${myTeam}</div><div style='font-size:24px;font-weight:900'>3-0</div>
   <div class='mini'>G Logen 10<br>D Kuziva 9.6<br>D Chelsea 7.5<br>D Faith 9.5<br>D Kimberley 10 ✎<br>M Martha 10<br>M Stayce 9.9<br>M Modesta 9.5<br>M Tariro 8.5<br>A Ropafadzo 10<br>A Blessed 10</div>
  </div>
  <div style='width:120px;text-align:center;padding:6px;border-left:1px solid #334155;border-right:1px solid #334155'><div>🏟️ Quatracul Arena<br>👥 74208<br>💰 1M 186k</div><div style='margin-top:8px;font-size:11px'>⚽ Chelsea 8'<br>⚽ Tariro 36'<br>⚽ Blessed 53'</div></div>
  <div style='flex:1;padding:6px'><div style='background:#dc2626;padding:4px;border-radius:4px'>Liverpool</div>
   <div class='mini'>G Alisson 4.8<br>D Alexander-Arnold 4.0<br>D Van Dijk 4.4<br>D Joe Gomez 2.3<br>D Joel Matip 3.8<br>D Robertson 4.7<br>M Henderson 3.5<br>M Oxlade-Chamberlain 3.1<br>M Diogo Jota 4.7<br>M Naby Keita 4.4<br>A Mané 5.8<br>A Takumi Minamino 4.0<br>A Salah 6.5<br>A Roberto Firmino 3.7</div>
  </div>
 </div>
 <div style='position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:8px'><div class='bicon'>📋</div><div class='bicon'>📊</div><div class='bicon' style='background:#22c55e;color:#000' onclick='renderSquad()'>➡️</div></div>`;
}
renderSquad();
</script></body></html>
