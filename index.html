<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>QFooty 5.0 v4 Chelsea $200M</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#e2e8f0;font-family:system-ui}header{position:sticky;top:0;background:#1e293b;padding:10px;display:flex;justify-content:space-between;align-items:center;z-index:10;flex-wrap:wrap;gap:6px}.logo{font-weight:900;color:#22c55e}.btn{background:#22c55e;color:#000;border:0;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:3px;background:#1e293b;padding:5px;position:sticky;top:58px;z-index:9;overflow:auto}.tab{padding:7px 10px;border-radius:6px;opacity:.6;white-space:nowrap;cursor:pointer;font-size:13px}.tab.active{background:#22c55e;color:#000;opacity:1}.card{background:#1e293b;margin:8px;padding:12px;border-radius:12px;border:1px solid #334155}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff12;align-items:center;font-size:13px}.small{font-size:11px;opacity:.7}.table{width:100%;font-size:12px;border-collapse:collapse}.table th{text-align:left;opacity:.6;font-size:10px;padding:3px}.table td{padding:4px 3px;border-bottom:1px solid #ffffff0f}.fixture{background:#0f172a;padding:8px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155;font-size:13px}.progress{height:7px;background:#0f172a;border-radius:4px;overflow:hidden;margin:6px 0}.progress div{height:100%;background:#22c55e}select{background:#0f172a;color:#22c55e;border:1px solid #22c55e;padding:6px;border-radius:6px;font-weight:800}</style></head><body>
<header><div class='logo'>QFooty v4 CHELSEA $200M</div><select id='teamSel' onchange='changeTeam(this.value)'><option>Chelsea</option><option>Man City</option><option>Arsenal</option><option>Liverpool</option><option>Man Utd</option><option>Real Madrid</option><option>Barcelona</option><option>Bayern Munich</option><option>PSG</option><option>Al Hilal</option><option>Al Nassr</option><option>Mamelodi Sundowns</option><option>Kaizer Chiefs</option><option>Orlando Pirates</option><option>Santos</option><option>Flamengo</option><option>Inter Miami</option></select><div class='small' id='budgetLabel'></div><button class='btn' onclick='playNext()'>PLAY</button></header>
<div class='tabs'><div class='tab active' onclick="showTab('dash',this)">Season</div><div class='tab' onclick="showTab('fixtures',this)">Fix</div><div class='tab' onclick="showTab('table',this)">Table</div><div class='tab' onclick="showTab('stats',this)">Stats</div><div class='tab' onclick="showTab('awards',this)">Awards</div><div class='tab' onclick="showTab('transfers',this)">Transfers</div></div>
<div id='dash'></div><div id='fixtures' style='display:none'></div><div id='table' style='display:none'></div><div id='stats' style='display:none'></div><div id='awards' style='display:none'></div><div id='transfers' style='display:none'></div>
<script>
const TEAMS={"Premier League":["Man City","Arsenal","Liverpool","Chelsea","Man Utd","Newcastle","Tottenham","Aston Villa","Brighton","West Ham","Crystal Palace","Fulham","Wolves","Everton","Brentford","Nottm Forest","Bournemouth","Luton Town","Sheffield Utd","Burnley"],"La Liga":["Real Madrid","Barcelona","Atletico Madrid","Sevilla","Real Sociedad","Villarreal","Real Betis","Athletic Bilbao","Valencia","Osasuna","Celta Vigo","Rayo Vallecano","Mallorca","Girona","Getafe","Las Palmas","Alaves","Cadiz","Granada","Almeria"],"Bundesliga":["Bayern Munich","Bayer Leverkusen","Dortmund","RB Leipzig","Stuttgart","Eintracht Frankfurt","Hoffenheim","Werder Bremen","Freiburg","Augsburg","Wolfsburg","Mainz","Gladbach","Union Berlin","Koln","Bochum","Heidenheim","Darmstadt"],"Ligue 1":["PSG","Lens","Marseille","Monaco","Lille","Rennes","Lyon","Nice","Reims","Montpellier","Toulouse","Strasbourg","Nantes","Brest","Lorient","Metz","Le Havre","Clermont"],"Serie A":["Inter Milan","AC Milan","Juventus","Napoli","AS Roma","Lazio","Atalanta","Fiorentina","Bologna","Torino","Monza","Genoa","Lecce","Udinese","Sassuolo","Frosinone","Verona","Cagliari","Empoli","Salernitana"],"Rest Super":["Ajax","PSV","Benfica","Porto","Celtic","Rangers","Al Hilal","Al Nassr","Al Ittihad","Mamelodi Sundowns","Flamengo","Galatasaray"],"Rest 2":["Santos","Kaizer Chiefs","Orlando Pirates","Simba SC","TP Mazembe","Inter Miami","LAFC","River Plate","Boca Juniors","Palmeiras"]};
const BUDGETS={"Man City":250,"Arsenal":180,"Liverpool":170,"Chelsea":200,"Man Utd":190,"Newcastle":150,"Tottenham":140,"Real Madrid":300,"Barcelona":200,"Atletico Madrid":120,"Bayern Munich":220,"Bayer Leverkusen":90,"Dortmund":110,"PSG":280,"Inter Milan":110,"Juventus":130,"Ajax":70,"Al Hilal":180,"Al Nassr":160,"Al Ittihad":140,"Mamelodi Sundowns":12,"Santos":18,"Kaizer Chiefs":8,"Orlando Pirates":8,"Simba SC":5,"TP Mazembe":6,"Inter Miami":120,"Flamengo":45};
function getB(t){return BUDGETS[t]||60;}
let myTeam=localStorage.getItem('qfooty_team')||'Chelsea'; let myLeague=Object.keys(TEAMS).find(l=>TEAMS[l].includes(myTeam))||'Premier League';
let budget=parseInt(localStorage.getItem('qfooty_b_'+myTeam)||getB(myTeam)); let db={}, table={}, fixtures=[], results=[], stats={}, market=[];
function genSquad(tm){let a=[]; if(tm==='Chelsea'){a.push({n:'Palmer',ovr:86,pos:'FW',g:0,as:0,cs:0}); a.push({n:'Jackson',ovr:78,pos:'FW',g:0,as:0,cs:0}); a.push({n:'Enzo Fernandez',ovr:84,pos:'MID',g:0,as:0,cs:0}); a.push({n:'Caicedo',ovr:82,pos:'MID',g:0,as:0,cs:0}); a.push({n:'Sanchez GK',ovr:76,pos:'GK',g:0,as:0,cs:0});} else {a.push({n:tm+' ST',ovr:75,pos:'FW',g:0,as:0,cs:0}); a.push({n:tm+' GK',ovr:70,pos:'GK',g:0,as:0,cs:0});} for(let i=a.length;i<22;i++){let pos=['DEF','MID','FW','GK'][i%4]; a.push({n:tm.slice(0,3)+i,pos:pos,ovr:60+Math.floor(Math.random()*20),g:0,as:0,cs:0});} return a;}
function changeTeam(t){localStorage.setItem('qfooty_team',t); localStorage.removeItem('qfooty_table_'+myLeague); localStorage.removeItem('qfooty_fix_'+myLeague); localStorage.removeItem('qfooty_stats_'+myLeague); location.reload();}
function init(){let sel=document.getElementById('teamSel'); if(sel) sel.value=myTeam; Object.keys(TEAMS).forEach(lg=>TEAMS[lg].forEach(t=>{db[t]=genSquad(t);})); let teams=TEAMS[myLeague]; table={}; teams.forEach(t=>table[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0}); fixtures=[]; let others=teams.filter(t=>t!==myTeam); let s=[...others].sort(()=>Math.random()-0.5); let g=1; s.forEach(o=>{fixtures.push({gw:g++,home:myTeam,away:o,played:false});}); s.sort(()=>Math.random()-0.5).forEach(o=>{fixtures.push({gw:g++,home:o,away:myTeam,played:false});}); fixtures=fixtures.slice(0,38); fixtures.forEach((f,i)=>f.gw=i+1); for(let i=0;i<25;i++){market.push({id:i,name:'Player '+i+' OVR '+(70+Math.floor(Math.random()*20)),ovr:70+Math.floor(Math.random()*20),val:10+Math.floor(Math.random()*20)});} let saved=localStorage.getItem('qfooty_table_'+myLeague); if(saved){try{table=JSON.parse(saved);}catch(e){}} let savedF=localStorage.getItem('qfooty_fix_'+myLeague); if(savedF){try{fixtures=JSON.parse(savedF);}catch(e){}} let savedS=localStorage.getItem('qfooty_stats_'+myLeague); if(savedS){try{stats=JSON.parse(savedS);}catch(e){}} render();}
function awardG(team,c){let sq=db[team]; if(!sq) return []; let fw=sq.filter(p=>p.pos==='FW'); let sc=[]; for(let i=0;i<c;i++){let p=fw[Math.floor(Math.random()*Math.min(3,fw.length))]; if(p){p.g++; sc.push(p.n); let k=p.n; if(!stats[k]) stats[k]={team:team,g:0,a:0,cs:0,pos:p.pos}; stats[k].g++; stats[k].team=team;}} return sc;}
function awardCS(team){let sq=db[team]; if(!sq) return; let gk=sq.find(p=>p.pos==='GK'); if(gk){gk.cs++; let k=gk.n; if(!stats[k]) stats[k]={team:team,g:0,a:0,cs:0,pos:'GK'}; stats[k].cs++;}}
function playNext(){let f=fixtures.find(x=>!x.played); if(!f){alert('Season over champ '+Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS)[0][0]); return;} let mg=Math.floor(Math.random()*3); let og=Math.floor(Math.random()*3); f.played=true; f.mg=f.home===myTeam?mg:og; f.og=f.home===myTeam?og:mg; f.res=f.mg>f.og?'W':f.mg===f.og?'D':'L'; if(f.mg>0) f.scorers=awardG(f.home,f.mg); if(f.og>0) f.scorers2=awardG(f.away,f.og); if(f.mg===0) awardCS(f.away); if(f.og===0) awardCS(f.home); table[f.home].P++; table[f.away].P++; table[f.home].GF+=f.mg; table[f.home].GA+=f.og; table[f.away].GF+=f.og; table[f.away].GA+=f.mg; if(f.mg>f.og){table[f.home].W++; table[f.home].PTS+=3; table[f.away].L++;}else if(f.og>f.mg){table[f.away].W++; table[f.away].PTS+=3; table[f.home].L++;}else{table[f.home].D++; table[f.away].D++; table[f.home].PTS++; table[f.away].PTS++;} results.push(f); localStorage.setItem('qfooty_table_'+myLeague,JSON.stringify(table)); localStorage.setItem('qfooty_fix_'+myLeague,JSON.stringify(fixtures)); localStorage.setItem('qfooty_stats_'+myLeague,JSON.stringify(stats)); render();}
function render(){document.getElementById('budgetLabel').innerText=myTeam+' $'+budget+'M real $'+getB(myTeam)+'M'; let next=fixtures.find(f=>!f.played); let t=table[myTeam]||{P:0,PTS:0}; let prog=Math.round(fixtures.filter(f=>f.played).length/fixtures.length*100); document.getElementById('dash').innerHTML="<div class='card'><h3>"+myTeam+" "+myLeague+" $"+budget+"M real $"+getB(myTeam)+"M - CHELSEA IS BLUE</h3><div class='progress'><div style='width:"+prog+"%'></div></div><div>P "+t.P+" PTS "+t.PTS+"</div></div><div class='card'><h3>Next GW"+(next?next.gw:'-')+" "+(next?next.home+" vs "+next.away:'Done')+"</h3>"+(next?"<div class='fixture'><div>"+next.home+" vs "+next.away+"</div><button class='btn' onclick='playNext()'>PLAY</button></div>":"Champion "+Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS)[0][0])+"</div><div class='card'><h3>Last</h3>"+results.slice(-5).reverse().map(r=>"<div class='row'><div>GW"+r.gw+" "+r.home+" "+r.mg+"-"+r.og+" "+r.away+" "+(r.scorers?r.scorers.join(','):'CS')+"</div><div>"+r.res+"</div></div>").join('')+"</div>"; document.getElementById('fixtures').innerHTML="<div class='card'><h3>Fixtures 38</h3>"+fixtures.map(f=>"<div class='fixture'><div>GW"+f.gw+" "+f.home+" vs "+f.away+" "+(f.played?f.mg+"-"+f.og:"")+"</div><div>"+(f.played?f.res:"UP")+"</div></div>").join('')+"</div>"; let sorted=Object.entries(table).sort((a,b)=>b[1].PTS-a[1].PTS); document.getElementById('table').innerHTML="<div class='card'><h3>Table</h3><table class='table'><tr><th>#</th><th>Team</th><th>P</th><th>PTS</th></tr>"+sorted.map((e,i)=>"<tr><td>"+(i+1)+"</td><td>"+e[0]+(e[0]===myTeam?" YOU":"")+"</td><td>"+e[1].P+"</td><td>"+e[1].PTS+"</td></tr>").join('')+"</table></div>"; let top=Object.entries(stats).sort((a,b)=>b[1].g-a[1].g).slice(0,15); let topCS=Object.entries(stats).filter(e=>e[1].cs>0).sort((a,b)=>b[1].cs-a[1].cs).slice(0,10); document.getElementById('stats').innerHTML="<div class='card'><h3>Top Scorers</h3><table class='table'>"+top.map((e,i)=>"<tr><td>"+(i+1)+"</td><td>"+e[0]+"</td><td>"+e[1].team+"</td><td>"+e[1].g+"</td></tr>").join('')+"</table></div><div class='card'><h3>Clean Sheets GK</h3><table class='table'>"+topCS.map((e,i)=>"<tr><td>"+(i+1)+"</td><td>"+e[0]+"</td><td>"+e[1].team+"</td><td>"+e[1].cs+"</td></tr>").join('')+"</table></div>"; document.getElementById('awards').innerHTML="<div class='card'><h3>Awards</h3><div class='row'><div>Champion</div><div>"+(sorted[0]?sorted[0][0]:'-')+"</div></div><div class='row'><div>Golden Boot</div><div>"+(top[0]?top[0][0]+" "+top[0][1].g:"-")+"</div></div><div class='row'><div>Golden Glove CS</div><div>"+(topCS[0]?topCS[0][0]+" "+topCS[0][1].cs:"-")+"</div></div></div>"; document.getElementById('transfers').innerHTML="<div class='card'><h3>Market Budget $"+budget+"M</h3>"+market.map(m=>"<div class='row'><div>"+m.name+" $"+m.val+"M</div><div><button class='btn' onclick='buy("+m.id+")'>Buy</button></div></div>").join('')+"</div>";}
function buy(id){let p=market.find(x=>x.id===id); if(budget<p.val){alert('no money'); return;} budget-=p.val; market=market.filter(x=>x.id!==id); localStorage.setItem('qfooty_b_'+myTeam,budget); render();}
function showTab(id,el){document.querySelectorAll('#dash,#fixtures,#table,#stats,#awards,#transfers').forEach(d=>d.style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');}
init();
</script></body></html>
